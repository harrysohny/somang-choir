<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#163b63">
  <title>소망 찬양대</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="brand">소망 찬양대</div>
        <div class="sub">SOMANG CHOIR</div>
      </div>
      <button class="ghost" id="profileBtn">내 정보</button>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav" id="bottomNav">
      <button data-page="home" class="active">홈</button>
      <button data-page="songs">찬양</button>
      <button data-page="notices">공지</button>
      <button data-page="members">대원</button>
      <button data-page="more">더보기</button>
    </nav>
  </div>

  <dialog id="joinDialog">
    <form method="dialog" class="dialog-card" id="joinForm">
      <h2>소망 찬양대 가입 신청</h2>
      <p class="muted">처음 가입할 때 본인 정보를 입력하고 총무의 승인을 받습니다.</p>

      <label>이름<input name="name" required placeholder="홍길동"></label>
      <label>직분<input name="title" placeholder="장로 / 권사 / 집사 / 성도"></label>
      <label>파트
        <select name="part" required>
          <option value="">선택</option>
          <option>Soprano</option>
          <option>Alto</option>
          <option>Tenor</option>
          <option>Bass</option>
        </select>
      </label>
      <label>연락처<input name="phone" placeholder="010-0000-0000"></label>
      <label>사진<input name="photo" type="file" accept="image/*"></label>

      <div class="consent">
        <label><input type="checkbox" required> 대원명단 내 사진·연락처 공개에 동의합니다.</label>
      </div>

      <div class="dialog-actions">
        <button value="cancel" class="secondary">취소</button>
        <button id="submitJoin" value="default">가입 신청</button>
      </div>
    </form>
  </dialog>

  <dialog id="profileDialog">
    <div class="dialog-card">
      <h2>내 정보</h2>
      <div id="profileContent"></div>
      <div class="dialog-actions">
        <button onclick="document.getElementById('profileDialog').close()">닫기</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>

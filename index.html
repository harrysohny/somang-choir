n.ok{background:#ebf8f1;color:var(--ok)}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}.sectiontitle h2{margin:0;font-size:21px}.loginwrap{max-width:520px;margin:36px auto}.loginbox{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}.loginbox h1{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d6dae0;border-radius:11px;padding:12px;background:#fff}.field textarea{min-height:110px;resize:vertical}.wide{width:100%}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}.statusbox{padding:18px;border-radius:16px;background:#fff;border:1px solid var(--line)}nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.98);border-top:1px solid var(--line);z-index:20}.navin{max-width:1050px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}nav button{border:0;background:transparent;padding:11px 4px 12px;color:#6b7280;font-size:12px}nav button b{display:block;font-size:17px;margin-bottom:2px}nav button.active{color:var(--brand);font-weight:800}.adminGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.adminTile{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;text-align:left}.adminTile b{display:block;margin-bottom:5px}.membergrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.member{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.member .name{font-weight:800;font-size:17px}.link{color:#245f9b;text-decoration:none;font-weight:700}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#20252b;color:#fff;padding:10px 14px;border-radius:10px;z-index:99;display:none;max-width:85%;text-align:center}.codehint{font-size:12px;color:# /* V11.8 YouTube popup refinements */
.ytModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99999;

  box-sizing:border-box;

.ytBox{
  position:relative;
  width:min(920px,96vw);

  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 22px 70px rgba(0,0,0,.45);

.ytHead{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:52px;
  padding:10px 12px 10px 16px;
  border-bottom:1px solid #e5e7eb;
  background:#fff;

.ytHead b{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;

}
.ytClose{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:78px;
  height:38px;
  padding:0 14px;
  border:1px solid #cfd8d6;

.ytFrameWrap{
  position:relative;
  width:100%;

}

<body><div class="app"><header><div class="head"><div class="brand"><b>소망 찬양대</b><small>SOMANG CHOIR</small></div><button id="headerBtn" class="topbtn" onclick="headerAction()">로그인</button></div></header><main id="main"></main></div><nav id="nav" style="display:none"><div class="navin"><button onclick="go('home')" data-page="home"><b>⌂</b>홈</button><button onclick="go('songs')" data-page="songs"><b>♫</b>찬양</button><button onclick="go('prayers')" data-page="prayers"><b>♡</b>기도</button><button onclick="go('members')" data-page="members"><b>♙</b>대원</button><button onclick="go('more')" data-page="more"><b>☰</b>더보기</button></div></nav><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://chsfhwewskydnreodvvq.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_MoLRdCftzWbvdGkWyeGoEg_My1j8-XB';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let session=null, me=null, perms=[], page='home';
const PERM_LABELS={members:'대원명단/가입승인',notices:'공지 관리',songs:'연습 찬양곡 기본정보·전체합창 (총무)',song_replay:'찬양곡 다시보기 등록',song_soprano:'Soprano 영상 입력',song_alto:'Alto 영상 입력',song_tenor:'Tenor 영상 입력',song_bass:'Bass 영상 입력',prayers:'기도당번',events:'일정·행사',intro:'찬양대 소개',leaders:'섬기는 분들',gallery:'갤러리',documents:'자료실',polls:'투표·설문',tasks:'봉사·할일',permissions:'관리자 권한'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function partKo(part){return ({Soprano:'소프라노',Alto:'알토',Tenor:'테너',Bass:'베이스'})[part]||part||''}
function memberPrayerLabel(m){return [partKo(m?.part),m?.name,m?.title].filter(Boolean).join(' ')}
function addDaysISO(base,days){const d=new Date((base||new Date().toISOString().slice(0,10))+'T00:00:00');d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function myPrayerLabel(){return memberPrayerLabel(me)}
function prayerRolesForMe(x){const mine=myPrayerLabel(),a=[];if(!mine)return a;if(x.thursday_start===mine)a.push({date:x.thursday_date,when:'목요일 연습',role:'시작기도'});if(x.thursday_end===mine)a.push({date:x.thursday_date,when:'목요일 연습',role:'마침기도'});if(x.sunday_start===mine)a.push({date:x.sunday_date,when:'일요일 연습',role:'시작기도'});if(x.sunday_end===mine)a.push({date:x.sunday_date,when:'일요일 연습',role:'마침기도'});return a}
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('ko-KR'):'';
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function normalizePhone(v){let d=(v||'').replace(/\D/g,'');if(d.startsWith('82')) d='0'+d.slice(2);return d}
function phoneDisplay(v){const d=normalizePhone(v);return d.length===11?`${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`:d}
function aliasEmail(phone){return normalizePhone(phone)+'@somangchoir.app'}
function can(p){return me?.role==='superadmin'||perms.includes(p)}
function canAnySong(){return me?.role==='superadmin'||['songs','song_replay','song_soprano','song_alto','song_tenor','song_bass'].some(p=>perms.includes(p))}
function canSongBase(){return me?.role==='superadmin'||perms.includes('songs')}
function canSongReplay(){return me?.role==='superadmin'||perms.includes('song_replay')||perms.includes('songs')}
function songPartPerm(part){return 'song_'+String(part||'').toLowerCase()}
function canSongPart(part){return me?.role==='superadmin'||perms.includes(songPartPerm(part))}

let _backAction=null;
function setBackAction(fn){_backAction=fn}
function smartBack(){
  if(typeof _backAction==='function'){const fn=_backAction;_backAction=null;fn();return}
  if(page==='admin'){go('more');return}
  if(['notices','events','intro','leaders','gallery','documents','polls','tasks'].includes(page)){go('more');return}
  if(['songs','prayers','members'].includes(page)){go('home');return}
  if(page==='more'){go('home');return}
  go('home');
}

function headerAction(){if(!session) return renderAuth(); if(confirm('로그아웃하시겠습니까?')) logout()}
async function logout(){await sb.auth.signOut();session=null;me=null;perms=[];renderAuth()}
async function init(){const {data}=await sb.auth.getSession();session=data.session; if(session) await loadMe(); else renderAuth(); sb.auth.onAuthStateChange(async(e,s)=>{session=s;if(e==='TOKEN_REFRESHED')return;if(e==='SIGNED_OUT'||!s){me=null;perms=[];renderAuth();return}if(e==='SIGNED_IN'||e==='USER_UPDATED')await loadMe()})}
async function loadMe(){const uid=session.user.id;const {data,error}=await sb.from('profiles').select('*').eq('id',uid).single();if(error){main.innerHTML=`<div class="statusbox">프로필을 불러오지 못했습니다.<br>${esc(error.message)}</div>`;return}me=data;const pr=await sb.from('user_permissions').select('permission').eq('user_id',uid);perms=(pr.data||[]).map(x=>x.permission);document.getElementById('headerBtn').textContent='로그아웃';if(me.status==='approved'){document.getElementById('nav').style.display='block';const ed=getSongEditorState();if(ed){if(ed.mode==='practice-new')await addPracticeSong();else if(ed.mode==='replay-new')await addReplaySong();else if(ed.mode==='practice-edit'&&ed.id){const r=await sb.from('songs').select('*').eq('id',ed.id).single();if(r.data)await editPracticeSong(r.data);else go('home')}else if(ed.mode==='replay-edit'&&ed.id){const r=await sb.from('songs').select('*').eq('id',ed.id).single();if(r.data)await editReplaySong(r.data);else go('home')}else go(page||'home')}else go(page||'home')}else{document.getElementById('nav').style.display='none';renderPending()}}
function renderPending(){const st={pending:'승인 대기 중',rejected:'가입 신청이 반려되었습니다',inactive:'현재 이용이 중지된 계정입니다'}[me.status]||me.status;main.innerHTML=`<div class="loginwrap"><div class="loginbox"><h1>${st}</h1><p><b>${esc(me.name)}</b> 님의 가입 정보가 등록되었습니다.</p><p class="muted">소망 찬양대 관리자가 확인 후 승인하면 전체 메뉴를 사용할 수 있습니다.</p><div class="codehint">휴대전화번호: ${esc(phoneDisplay(me.phone))} · 파트: ${esc(me.part||'-')}</div><button class="btn wide" style="margin-top:16px" onclick="logout()">로그아웃</button></div></div>`}
function renderAuth(){const mainEl=document.getElementById('main');document.getElementById('headerBtn').textContent='로그인';document.getElementById('nav').style.display='none';mainEl.innerHTML=`<div class="loginwrap"><div class="loginbox"><h1>소망 찬양대</h1><p class="muted">대원 전용 소통·관리 앱</p><div class="tabs"><button class="btn primary" onclick="showLogin()">로그인</button><button class="btn" onclick="showSignup()">가입 신청</button></div><div id="authBody"></div></div></div>`;showLogin()}
function showLogin(){const authBody=document.getElementById('authBody');if(!authBody)return;authBody.innerHTML=`<div class="field"><label>휴대전화번호</label><input id="lphone" inputmode="tel" placeholder="010-1234-5678"></div><div class="field"><label>비밀번호</label><input id="lpw" type="password" placeholder="비밀번호"></div><button class="btn primary wide" onclick="doLogin()">로그인</button><p class="muted" style="margin-top:14px">비밀번호를 잊은 경우 총무/관리자에게 본인 확인 후 재설정을 요청해 주세요.</p>`}
function showSignup(){const authBody=document.getElementById('authBody');if(!authBody)return;authBody.innerHTML=`<div class="field"><label>이름</label><input id="sname" placeholder="홍길동"></div><div class="field"><label>직분/호칭</label><input id="stitle" placeholder="집사, 권사, 장로 등"></div><div class="field"><label>파트</label><select id="spart"><option>Soprano</option><option>Alto</option><option>Tenor</option><option>Bass</option></select></div><div class="field"><label>휴대전화번호</label><input id="sphone" inputmode="tel" placeholder="010-1234-5678"></div><div class="field"><label>비밀번호 (6자 이상)</label><input id="spw" type="password"></div><div class="field"><label>비밀번호 확인</label><input id="spw2" type="password"></div><button class="btn primary wide" onclick="doSignup()">가입 신청</button><p class="muted">가입 후 관리자 승인을 받아야 대원 전용 메뉴가 열립니다.</p>`}
async function doLogin(){const p=normalizePhone(lphone.value),pw=lpw.value;if(p.length<10)return toast('휴대전화번호를 확인해 주세요.');const {error}=await sb.auth.signInWithPassword({email:aliasEmail(p),password:pw});if(error)toast('로그인 실패: '+error.message)}
async function doSignup(){const p=normalizePhone(sphone.value),pw=spw.value;if(!sname.value.trim())return toast('이름을 입력해 주세요.');if(p.length<10)return toast('휴대전화번호를 확인해 주세요.');if(pw.length<6)return toast('비밀번호는 6자 이상입니다.');if(pw!==spw2.value)return toast('비밀번호가 서로 다릅니다.');const {error}=await sb.auth.signUp({email:aliasEmail(p),password:pw,options:{data:{name:sname.value.trim(),title:stitle.value.trim(),part:spart.value,phone:p}}});if(error)return toast('가입 실패: '+error.message);toast('가입 신청이 등록되었습니다.');setTimeout(()=>showLogin(),900)}

function youtubeId(url){
  try{
    const u=new URL(String(url||'').trim());
    const host=u.hostname.replace(/^www\./,'');
    if(host==='youtu.be') return u.pathname.split('/').filter(Boolean)[0]||null;
    if(host.endsWith('youtube.com')){
      if(u.pathname==='/watch') return u.searchParams.get('v');
      const m=u.pathname.match(/^\/(?:embed|shorts|live)\/([^/?#]+)/);
      if(m) return m[1];
    }
  }catch(e){}
  return null;
}
function openYouTubeModal(url,title='YouTube'){
  const id=youtubeId(url);
  if(!id){toast('올바른 YouTube 링크가 아닙니다.');return}
  const modal=document.getElementById('ytModal');
  const frame=document.getElementById('ytFrame');
  const ttl=document.getElementById('ytModalTitle');
  if(!modal||!frame||!ttl){toast('영상 팝업을 열 수 없습니다.');return}
  ttl.textContent=title||'YouTube';
  frame.src=`https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&playsinline=1`;
  modal.classList.add('show');
  modal.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closeYouTubeModal(){
  const modal=document.getElementById('ytModal');
  const frame=document.getElementById('ytFrame');
  if(frame) frame.src='about:blank';
  if(modal){modal.classList.remove('show');modal.setAttribute('aria-hidden','true')}
  document.body.style.overflow='';
}

async function signedGalleryUrl(path,expires=3600){
  if(!path)return '';
  if(/^https?:\/\//i.test(path))return path;
  const {data,error}=await sb.storage.from('gallery').createSignedUrl(path,expires);
  return error?'':(data?.signedUrl||'');
}
function safeFileName(name){
  const ext=(String(name).split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  return Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
}

  const o=collectSongSchedule();

  o.created_by=session.user.id;

async function saveGalleryAlbum(){
  const eventDate=document.getElementById('g_event_date')?.value;
  const titleV=document.getElementById('g_title')?.value.trim();
  const description=document.getElementById('g_description')?.value.trim()||null;const coverCaption=document.getElementById('galleryCoverCaption_0')?.value.trim()||null;
  if(!eventDate||!titleV)return toast('행사일자와 행사명은 필수입니다.');
  if(!galleryCoverFile)return toast('대표사진 1장을 선택해 주세요.');
  if(galleryPhotoFiles.length>20)return toast('추가사진은 최대 20장입니다.');
  const progress=document.getElementById('galleryUploadProgress');progress.style.display='block';progress.textContent='앨범을 생성하고 있습니다…';
  const {data:album,error}=await sb.from('gallery').insert({event_date:eventDate,title:titleV,description,created_by:me.id}).select().single();
  if(error){progress.style.display='none';return toast(error.message)}
  const albumId=album.id;
  try{
    const coverPath=`${albumId}/cover/${safeFileName(galleryCoverFile.name)}`;
    progress.textContent='대표사진 업로드 중…';
    let r=await sb.storage.from('gallery').upload(coverPath,galleryCoverFile,{upsert:false,contentType:galleryCoverFile.type||undefined});
    if(r.error)throw r.error;
    r=await sb.from('gallery').update({cover_path:coverPath,cover_caption:coverCaption}).eq('id',albumId);if(r.error)throw r.error;
    for(let i=0;i<galleryPhotoFiles.length;i++){
      const file=galleryPhotoFiles[i], path=`${albumId}/photos/${String(i+1).padStart(2,'0')}-${safeFileName(file.name)}`;
      progress.textContent=`추가사진 업로드 중… ${i+1} / ${galleryPhotoFiles.length}`;
      const up=await sb.storage.from('gallery').upload(path,file,{upsert:false,contentType:file.type||undefined});if(up.error)throw up.error;
      const caption=document.getElementById(`galleryPhotoCaption_${i}`)?.value.trim()||null;const ins=await sb.from('gallery_photos').insert({gallery_id:albumId,file_path:path,sort_order:i+1,caption});if(ins.error)throw ins.error;
    }
    progress.textContent='업로드 완료';
    toast('갤러리 앨범이 등록되었습니다.');galleryCoverFile=null;galleryPhotoFiles=[];manageGallery();
  }catch(err){
    progress.textContent='업로드 중 오류가 발생했습니다.';
    toast(err.message||String(err));
  }
}
async function deleteGalleryAlbum(id){
  if(!confirm('앨범과 등록된 사진을 모두 삭제하시겠습니까?'))return;
  const {data:photos}=await sb.from('gallery_photos').select('file_path').eq('gallery_id',id);
  const {data:album}=await sb.from('gallery').select('cover_path').eq('id',id).single();
  const paths=[album?.cover_path,...(photos||[]).map(x=>x.file_path)].filter(Boolean);
  if(paths.length)await sb.storage.from('gallery').remove(paths);
  const {error}=await sb.from('gallery').delete().eq('id',id);

}

function collect(type){const o={};for(const [k,,kind='text'] of FIELDS[type]||[]){const e=document.getElementById('f_'+k);o[k]=kind==='checkbox'?e.checked:kind==='number'?(e.value?Number(e.value):null):(e.value||null)}return o}
async function prayerFormHTML(obj={}){const {data,error}=await sb.from('profiles').select('name,title,part').eq('status','approved').order('name');if(error)throw error;const members=data||[];const sel=(k,l)=>{const current=obj[k]||'';return `<div class="field"><label>${l}</label><select id="f_${k}"><option value="">선택</option>${members.map(m=>{const label=memberPrayerLabel(m);return `<option value="${esc(label)}" ${label===current?'selected':''}>${esc(label)}</option>`}).join('')}</select></div>`};return `<div class="field"><label>목요일 날짜</label><input id="f_thursday_date" type="date" value="${esc(obj.thursday_date||'')}"></div><div class="field"><label>일요일 날짜</label><input id="f_sunday_date" type="date" value="${esc(obj.sunday_date||'')}"></div><h3 style="margin-top:18px">목요일 연습</h3>${sel('thursday_start','시작기도')}${sel('thursday_end','마침기도')}<h3 style="margin-top:18px">일요일 연습</h3>${sel('sunday_start','시작기도')}${sel('sunday_end','마침기도')}`;}
async function addPracticeSong(){setBackAction(()=>managePracticeSongs());if(!canSongBase())return toast('연습곡 기본 등록 권한이 없습니다.');clearSongEditorState();setSongEditorState({mode:'practice-new'});main.innerHTML=title('연습 찬양곡 등록')+`<div class="card">${songPracticeFormHTML({},true)}<div class="actions"><button class="btn primary" onclick="savePracticeNew()">저장</button><button class="btn" onclick="cancelPracticeEdit()">취소</button></div></div>`;bindSongDraft()}
async function editPracticeSong(obj){setBackAction(()=>managePracticeSongs());window._editObj=obj;setSongEditorState({mode:'practice-edit',id:obj.id});main.innerHTML=title(canSongBase()?'연습 찬양곡 수정':'내 파트 영상 입력')+`<div class="card">${songPracticeFormHTML(obj,false)}<div class="actions"><button class="btn primary" onclick="savePracticeEdit('${obj.id}')">저장</button><button class="btn" onclick="cancelPracticeEdit()">취소</button></div></div>`;bindSongDraft()}
function cancelPracticeEdit(){clearSongEditorState();managePracticeSongs()}
async function addReplaySong(){setBackAction(()=>manageReplaySongs());if(!canSongReplay())return toast('다시보기 등록 권한이 없습니다.');clearSongEditorState();setSongEditorState({mode:'replay-new'});main.innerHTML=title('찬양곡 다시보기 등록')+`<div class="card">${songReplayFormHTML({},true)}<div class="actions"><button class="btn primary" onclick="saveReplayNew()">저장</button><button class="btn" onclick="cancelReplayEdit()">취소</button></div></div>`;bindSongDraft()}
async function editReplaySong(obj){setBackAction(()=>manageReplaySongs());window._editObj=obj;setSongEditorState({mode:'replay-edit',id:obj.id});main.innerHTML=title('찬양곡 다시보기 수정')+`<div class="card">${songReplayFormHTML(obj,false)}<div class="actions"><button class="btn primary" onclick="saveReplayEdit('${obj.id}')">저장</button><button class="btn" onclick="cancelReplayEdit()">취소</button></div></div>`;bindSongDraft()}
function cancelReplayEdit(){clearSongEditorState();manageReplaySongs()}
async function savePracticeNew(){const titleV=document.getElementById('f_title')?.value.trim();if(!titleV)return toast('찬양곡명은 필수입니다.');const {error}=await sb.rpc('song_create_practice',{p_practice_date:document.getElementById('f_practice_date')?.value||null,p_category:[...document.querySelectorAll('.songcat:checked')].map(x=>x.value).join(',')||null,p_title:titleV,p_full_url:document.getElementById('f_full_url')?.value.trim()||null});if(error)return toast(error.message);clearSongEditorState();toast('연습 찬양곡이 등록되었습니다.');managePracticeSongs()}
async function savePracticeEdit(id){if(canSongBase()){const titleV=document.getElementById('f_title')?.value.trim();if(!titleV)return toast('찬양곡명은 필수입니다.');const {error}=await sb.rpc('song_update_practice_base',{p_song_id:id,p_practice_date:document.getElementById('f_practice_date')?.value||null,p_category:[...document.querySelectorAll('.songcat:checked')].map(x=>x.value).join(',')||null,p_title:titleV,p_full_url:document.getElementById('f_full_url')?.value.trim()||null});if(error)return toast(error.message)}for(const part of ['Soprano','Alto','Tenor','Bass'])if(canSongPart(part)){const k=part.toLowerCase()+'_url',e=document.getElementById('f_'+k);if(e){const {error}=await sb.rpc('song_update_part',{p_song_id:id,p_part:part,p_url:e.value.trim()||null});if(error)return toast(error.message)}}clearSongEditorState();toast('수정되었습니다.');managePracticeSongs()}
async function saveReplayNew(){const date=document.getElementById('f_replay_date')?.value,titleV=document.getElementById('f_title')?.value.trim();if(!date||!titleV)return toast('다시보기 찬양일과 찬양곡명은 필수입니다.');const {error}=await sb.rpc('song_create_replay',{p_replay_date:date,p_title:titleV,p_live_url:document.getElementById('f_live_url')?.value.trim()||null});if(error)return toast(error.message);clearSongEditorState();toast('다시보기가 등록되었습니다.');manageReplaySongs()}
async function saveReplayEdit(id){const date=document.getElementById('f_replay_date')?.value,titleV=document.getElementById('f_title')?.value.trim();if(!date||!titleV)return toast('다시보기 찬양일과 찬양곡명은 필수입니다.');const {error}=await sb.rpc('song_update_replay',{p_song_id:id,p_replay_date:date,p_title:titleV,p_live_url:document.getElementById('f_live_url')?.value.trim()||null});if(error)return toast(error.message);clearSongEditorState();toast('수정되었습니다.');manageReplaySongs()}
async function addRecord(type,restored=false){setBackAction(()=>type==='gallery'?manageGallery():manage(type));if(type==='songs'){if(!canSongBase())return toast('새 찬양 등록은 총무/기본정보 담당자만 가능합니다.');setSongEditorState({mode:'new'});main.innerHTML=title('새 찬양 등록')+`<div class="card">${songFormHTML({},true)}<div class="actions"><button class="btn primary" onclick="saveNew('songs')">저장</button><button class="btn" onclick="cancelSongEdit()">취소</button></div></div>`;bindSongDraft();return}const html=type==='prayers'?await prayerFormHTML():formHTML(type);main.innerHTML=title('새로 등록')+`<div class="card">${html}<button class="btn primary" onclick="saveNew('${type}')">저장</button> <button class="btn" onclick="manage('${type}')">취소</button></div>`}
async function editRecord(type,obj,restored=false){setBackAction(()=>type==='gallery'?manageGallery():manage(type));window._editObj=obj;if(type==='songs'){setSongEditorState({mode:'edit',id:obj.id});main.innerHTML=title(canSongBase()?'찬양 수정':'내 파트 영상 입력')+`<div class="card">${songFormHTML(obj,false)}<div class="actions"><button class="btn primary" onclick="saveEdit('songs','${obj.id}')">저장</button><button class="btn" onclick="cancelSongEdit()">취소</button></div></div>`;bindSongDraft();return}const html=type==='prayers'?await prayerFormHTML(obj):formHTML(type,obj);main.innerHTML=title('수정')+`<div class="card">${html}<button class="btn primary" onclick="saveEdit('${type}','${obj.id}')">저장</button> <button class="btn" onclick="manage('${type}')">취소</button></div>`}
function cancelSongEdit(){clearSongEditorState();manageSongs()}
async function saveNew(type){if(type==='songs'){const o=collectSong();if(!o.title)return toast('찬양곡명만 입력하면 저장할 수 있습니다.');o.created_by=me.id;const {error}=await sb.rpc('song_create_base',{p_service_date:o.service_date,p_category:o.category,p_title:o.title,p_full_url:o.full_url,p_live_url:o.live_url});if(error)return toast(error.message);clearSongEditorState();toast('찬양곡이 등록되었습니다. 파트별 영상은 각 파트장이 추가할 수 있습니다.');return manageSongs()}const map={notices:'notices',prayers:'prayer_assignments',events:'events',leaders:'leaders',gallery:'gallery',documents:'documents',polls:'polls',tasks:'tasks'};const o=collect(type);if(['notices','prayers','events','leaders','gallery','documents','polls','tasks'].includes(type))o.created_by=me.id;const {error}=await sb.from(map[type]).insert(o);if(error)return toast(error.message);toast('저장되었습니다.');manage(type)}
async function saveEdit(type,id){if(type==='songs'){const o=collectSong();if(canSongBase()){if(!o.title)return toast('찬양곡명은 필수입니다.');const {error}=await sb.rpc('song_update_base',{p_song_id:id,p_service_date:o.service_date,p_category:o.category,p_title:o.title,p_full_url:o.full_url,p_live_url:o.live_url});if(error)return toast(error.message)}for(const part of ['Soprano','Alto','Tenor','Bass']){if(canSongPart(part)){const k=part.toLowerCase()+'_url';if(k in o){const {error}=await sb.rpc('song_update_part',{p_song_id:id,p_part:part,p_url:o[k]});if(error)return toast(error.message)}}}clearSongEditorState();toast('수정되었습니다.');return manageSongs()}const map={notices:'notices',prayers:'prayer_assignments',events:'events',leaders:'leaders',gallery:'gallery',documents:'documents',polls:'polls',tasks:'tasks'};const {error}=await sb.from(map[type]).update(collect(type)).eq('id',id);if(error)return toast(error.message);toast('수정되었습니다.');manage(type)}
async function deleteRecord(type,id){if(!confirm('삭제하시겠습니까?'))return;if(type==='songs'){const {error}=await sb.rpc('song_delete',{p_song_id:id});if(error)return toast(error.message);toast('삭제되었습니다.');return manageSongs()}const map={notices:'notices',prayers:'prayer_assignments',events:'events',leaders:'leaders',gallery:'gallery',documents:'documents',polls:'polls',tasks:'tasks'};const {error}=await sb.from(map[type]).delete().eq('id',id);if(error)return toast(error.message);toast('삭제되었습니다.');manage(type)}
async function manageMembers(){setBackAction(()=>adminPage());const {data}=await sb.from('profiles').select('*').order('created_at',{ascending:false});main.innerHTML=title('가입 승인 · 대원 관리')+list((data||[]).map(x=>`<div class="row"><b>${esc(x.name)}</b> <span class="tag">${esc(x.part||'-')}</span><div class="muted">${esc(phoneDisplay(x.phone))} · ${esc(x.title||'')} · ${esc(x.status)} · ${esc(x.role)}</div><div class="actions">${x.status!=='approved'?`<button class="btn ok" onclick="setStatus('${x.id}','approved')">승인</button>`:''}${x.status==='approved'?`<button class="btn" onclick="setStatus('${x.id}','inactive')">중지</button>`:''}<button class="btn danger" onclick="setStatus('${x.id}','rejected')">반려</button>${me.role==='superadmin'?`<button class="btn" onclick="setRolePrompt('${x.id}','${x.role}')">역할</button>`:''}</div></div>`))}
async function setStatus(id,st){const {error}=await sb.rpc('admin_set_member_status',{p_user_id:id,p_status:st});if(error)return toast(error.message);toast('처리되었습니다.');manageMembers()}
async function setRolePrompt(id,cur){const r=prompt('역할을 입력하세요: member / manager / superadmin',cur);if(!r)return;const {error}=await sb.rpc('superadmin_set_member_role',{p_user_id:id,p_role:r});if(error)return toast(error.message);toast('역할이 변경되었습니다.');manageMembers()}
async function managePermissions(){setBackAction(()=>adminPage());if(me.role!=='superadmin')return toast('최고관리자만 가능합니다.');const {data}=await sb.from('profiles').select('id,name,part,status,role').eq('status','approved').order('name');main.innerHTML=title('관리자 권한 부여')+list((data||[]).map(x=>`<div class="row"><b>${esc(x.name)}</b> <span class="tag">${esc(x.role)}</span><div class="muted">${esc(x.part||'')}</div><div class="actions"><button class="btn" onclick="editPerms('${x.id}','${esc(x.name)}')">세부 권한 설정</button></div></div>`))}
async function editPerms(id,name){const {data}=await sb.from('user_permissions').select('permission').eq('user_id',id);const cur=(data||[]).map(x=>x.permission);main.innerHTML=title(name+' 권한')+`<div class="card">${Object.entries(PERM_LABELS).filter(([k])=>k!=='permissions').map(([k,l])=>`<div class="field"><label><input type="checkbox" class="permcheck" value="${k}" ${cur.includes(k)?'checked':''}> ${l}</label></div>`).join('')}<button class="btn primary" onclick="savePerms('${id}')">저장</button> <button class="btn" onclick="managePermissions()">취소</button></div>`}
async function savePerms(id){const arr=[...document.querySelectorAll('.permcheck:checked')].map(x=>x.value);const {error}=await sb.rpc('superadmin_set_permissions',{p_user_id:id,p_permissions:arr});if(error)return toast(error.message);toast('권한이 저장되었습니다.');managePermissions()}
async function editIntro(){setBackAction(()=>adminPage());const {data}=await sb.from('choir_intro').select('*').eq('id',1).single();main.innerHTML=title('찬양대 소개 수정')+`<div class="card">${[['name','이름'],['english_name','영문명'],['description','소개'],['founded','창단/역사 요약'],['service','예배'],['rehearsal','연습'],['history','역사'],['vision','비전']].map(([k,l])=>`<div class="field"><label>${l}</label>${['description','history','vision'].includes(k)?`<textarea id="i_${k}">${esc(data?.[k]||'')}</textarea>`:`<input id="i_${k}" value="${esc(data?.[k]||'')}">`}</div>`).join('')}<button class="btn primary" onclick="saveIntro()">저장</button></div>`}
async function saveIntro(){const o={};['name','english_name','description','founded','service','rehearsal','history','vision'].forEach(k=>o[k]=document.getElementById('i_'+k).value);o.updated_by=me.id;o.updated_at=new Date().toISOString();const {error}=await sb.from('choir_intro').update(o).eq('id',1);if(error)return toast(error.message);toast('저장되었습니다.');go('intro')}
function title(t,right='',showBack=true){return `<div class="sectiontitle"><div class="sectiontitleLeft">${showBack?`<button class="backBtn" type="button" onclick="smartBack()">← 이전</button>`:''}<h2>${esc(t)}</h2></div><div>${right}</div></div>`}
function list(a){return `<div class="list">${a.join('')||'<div class="empty">등록된 내용이 없습니다.</div>'}</div>`}
init();
</script><div id="ytModal" class="ytModal" aria-hidden="true">
  <div class="ytBox" role="dialog" aria-modal="true" aria-labelledby="ytModalTitle">
    <div class="ytHead">
      <b id="ytModalTitle">YouTube</b>
      <button type="button" class="ytClose" aria-label="영상 닫기" onclick="closeYouTubeModal()">닫기</button>
    </div>
    <div class="ytFrameWrap">
      <iframe id="ytFrame" src="about:blank" title="YouTube 영상" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>
</div>

<div id="imgModal" class="imgModal" aria-hidden="true">
  <div class="imgModalBox">
    <button type="button" class="imgModalClose" onclick="closeImageModal()">닫기</button>
    <img id="imgModalImage" alt="갤러리 사진"><div id="imgModalCaption" class="imgModalCaption"></div>
  </div>
</div>

</body></html>

function youtubeId(url){
  try{
    const u=new URL(String(url||'').trim());
    const host=u.hostname.replace(/^www\./,'');
    if(host==='youtu.be') return u.pathname.split('/').filter(Boolean)[0]||null;
    if(host.endsWith('youtube.com')){
      if(u.pathname==='/watch') return u.searchParams.get('v');
      const m=u.pathname.match(/^\/(?:embed|shorts|live)\/([^/?#]+)/);
      if(m) return m[1];
    }
  }catch(e){}
  return null;
}
function openYouTubeModal(url,title='YouTube'){
  const id=youtubeId(url);
  if(!id){toast('올바른 YouTube 링크가 아닙니다.');return}
  const modal=document.getElementById('ytModal');
  const frame=document.getElementById('ytFrame');
  const ttl=document.getElementById('ytModalTitle');
  if(!modal||!frame||!ttl){toast('영상 팝업을 열 수 없습니다.');return}
  ttl.textContent=title||'YouTube';
  frame.src=`https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&playsinline=1`;
  modal.classList.add('show');
  modal.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closeYouTubeModal(){
  const modal=document.getElementById('ytModal');
  const frame=document.getElementById('ytFrame');
  if(frame) frame.src='about:blank';
  if(modal){modal.classList.remove('show');modal.setAttribute('aria-hidden','true')}
  document.body.style.overflow='';
}

document.addEventListener('click',function(e){
  const play=e.target.closest?.('.ytPlayBtn');
  if(play){
    e.preventDefault();
    openYouTubeModal(play.dataset.ytUrl||'',play.dataset.ytTitle||'YouTube');
    return;
  }
  if(e.target.id==='ytModal') closeYouTubeModal();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeYouTubeModal()});

async function signedProfilePhoto(path,expires=3600){
  if(!path)return '';
  if(/^https?:\/\//i.test(path))return path;
  try{
    const {data,error}=await sb.storage.from('profile-photos').createSignedUrl(path,expires);
    return error?'':(data?.signedUrl||'');
  }catch(e){return ''}
}
async function membersPage(){
  const isMemberAdmin=(me?.role==='superadmin'||can('members'));

  const {data,error}=await sb.from('profiles')
    .select('id,name,title,part,phone,contact_email,phone_public,email_public,photo_path,choir_positions,bio,role,status')
    .eq('status','approved').order('part').order('name');
  if(error)return toast(error.message);

  // profile_private RLS:
  // 일반 대원 -> 본인 행만, 대원관리자 -> 전체 행 조회
  let privateMap={};
  try{
    const {data:priv,error:privErr}=await sb.from('profile_private')
      .select('user_id,birth_date,address');
    if(!privErr) privateMap=Object.fromEntries((priv||[]).map(x=>[x.user_id,x]));
  }catch(e){}

  const rows=[];
  for(const x of (data||[])){
    rows.push({
      ...x,
      ...(privateMap[x.id]||{}),
      photo_url:await signedProfilePhoto(x.photo_path),
      is_self:x.id===me?.id,
      can_view_all:isMemberAdmin||x.id===me?.id
    });
  }

  window._memberDirectoryRows=rows;
  main.innerHTML=title('전체 대원 현황')+`
    <div class="memberDirectoryHead">
      <div class="memberSearchWrap">
        <input id="memberSearch" class="memberSearch" type="search" inputmode="search"
          placeholder="이름으로 대원 찾기" autocomplete="off"
          oninput="filterMemberDirectory(this.value)">
        <span class="memberSearchIcon">⌕</span>
      </div>
      <div id="memberCount" class="memberCount">전체 ${rows.length}명</div>
    </div>
    <div id="memberList" class="memberList"></div>`;
  renderMemberDirectory(rows,'');
}

function memberContactHTML(x){
  const full=x.can_view_all;
  const lines=[];
  if(x.phone && (full||x.phone_public)) lines.push(`<div class="memberDetailLine">☎ ${esc(phoneDisplay(x.phone))}</div>`);
  if(x.contact_email && (full||x.email_public)) lines.push(`<div class="memberDetailLine">✉ ${esc(x.contact_email)}</div>`);
  return lines.join('');
}

function memberPrivateHTML(x){
  if(!x.can_view_all)return '';
  const pos=Array.isArray(x.choir_positions)?x.choir_positions:[];
  const rows=[];
  if(pos.length)rows.push(`<div><b>찬양대 직위</b> · ${esc(pos.join(', '))}</div>`);
  if(x.birth_date)rows.push(`<div><b>생년월일</b> · ${esc(x.birth_date)}</div>`);
  if(x.address)rows.push(`<div><b>주소</b> · ${esc(x.address)}</div>`);
  if(x.role)rows.push(`<div><b>시스템 역할</b> · ${esc(x.role)}</div>`);
  if(!rows.length)return '';
  return `<div class="memberPrivate"><span class="memberPrivateBadge">${x.is_self?'내 정보':'관리자 열람'}</span>${rows.join('')}</div>`;
}

function renderMemberDirectory(rows,query=''){
  const listEl=document.getElementById('memberList');
  const countEl=document.getElementById('memberCount');
  if(!listEl)return;
  const q=String(query||'').trim().toLowerCase();
  const filtered=(rows||[]).filter(x=>!q||String(x.name||'').toLowerCase().includes(q));
  if(countEl)countEl.textContent=q?`검색 ${filtered.length}명 / 전체 ${(rows||[]).length}명`:`전체 ${(rows||[]).length}명`;

  listEl.innerHTML=filtered.length?filtered.map(x=>`
    <div class="memberListItem">
      <div class="memberListPhoto">
        ${x.photo_url?`<img src="${esc(x.photo_url)}" alt="${esc(x.name)}">`:esc((x.name||'?').slice(0,1))}
      </div>
      <div class="memberListInfo">
        <div class="memberListTop">
          <span class="memberListName">${esc(x.name||'')}</span>
          <span class="memberPartBadge">${esc(partKo(x.part)||'-')}</span>
          <span class="memberTitle">${esc(x.title||'성도')}</span>
          ${x.is_self?'<span class="memberSelfBadge">나</span>':''}
        </div>
        ${x.bio?`<div class="memberBio">${esc(x.bio)}</div>`:''}
        <div class="memberDetail">${memberContactHTML(x)}</div>
        ${memberPrivateHTML(x)}
      </div>
    </div>`).join(''):`<div class="memberListEmpty">${q?'검색 결과가 없습니다.':'등록된 대원이 없습니다.'}</div>`;
}

function filterMemberDirectory(value){

async function signedGalleryUrl(path,expires=3600){
  if(!path)return '';
  if(/^https?:\/\//i.test(path))return path;
  const {data,error}=await sb.storage.from('gallery').createSignedUrl(path,expires);
  return error?'':(data?.signedUrl||'');
}
function safeFileName(name){
  const ext=(String(name).split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  return Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
}

async function saveGalleryAlbum(){
  const eventDate=document.getElementById('g_event_date')?.value;
  const titleV=document.getElementById('g_title')?.value.trim();
  const description=document.getElementById('g_description')?.value.trim()||null;const coverCaption=document.getElementById('galleryCoverCaption_0')?.value.trim()||null;
  if(!eventDate||!titleV)return toast('행사일자와 행사명은 필수입니다.');
  if(!galleryCoverFile)return toast('대표사진 1장을 선택해 주세요.');
  if(galleryPhotoFiles.length>20)return toast('추가사진은 최대 20장입니다.');

  if(error){progress.style.display='none';return toast(error.message)}
  const albumId=album.id;
  try{
    const coverPath=`${albumId}/cover/${safeFileName(galleryCoverFile.name)}`;
    progress.textContent='대표사진 업로드 중…';
    let r=await sb.storage.from('gallery').upload(coverPath,galleryCoverFile,{upsert:false,contentType:galleryCoverFile.type||undefined});
    if(r.error)throw r.error;
    r=await sb.from('gallery').update({cover_path:coverPath,cover_caption:coverCaption}).eq('id',albumId);if(r.error)throw r.error;
    for(let i=0;i<galleryPhotoFiles.length;i++){
      const file=galleryPhotoFiles[i], path=`${albumId}/photos/${String(i+1).padStart(2,'0')}-${safeFileName(file.name)}`;
      progress.textContent=`추가사진 업로드 중… ${i+1} / ${galleryPhotoFiles.length}`;
      const up=await sb.storage.from('gallery').upload(path,file,{upsert:false,contentType:file.type||undefined});if(up.error)throw up.error;
      const caption=document.getElementById(`galleryPhotoCaption_${i}`)?.value.trim()||null;const ins=await sb.from('gallery_photos').insert({gallery_id:albumId,file_path:path,sort_order:i+1,caption});if(ins.error)throw ins.error;
    }
    progress.textContent='업로드 완료';
    toast('갤러리 앨범이 등록되었습니다.');galleryCoverFile=null;galleryPhotoFiles=[];manageGallery();

async function deleteGalleryAlbum(id){
  if(!confirm('앨범과 등록된 사진을 모두 삭제하시겠습니까?'))return;
  const {data:photos}=await sb.from('gallery_photos').select('file_path').eq('gallery_id',id);
  const {data:album}=await sb.from('gallery').select('cover_path').eq('id',id).single();
  const paths=[album?.cover_path,...(photos||[]).map(x=>x.file_path)].filter(Boolean);
  if(paths.length)await sb.storage.from('gallery').remove(paths);

}

const SONG_DRAFT_KEY='somangSongDraftV10', SONG_EDITOR_KEY='somangSongEditorV10';

function saveSongDraft(){
  const ids=['service_date','practice_date','replay_date','title','full_url','soprano_url','alto_url','tenor_url','bass_url','live_url'];

let bulkMembersDraft=[];let bulkLastResults=[];
async function manageMembers(){
 setBackAction(()=>adminPage());
 const {data,error}=await sb.from('profiles').select('*').order('created_at',{ascending:false});
 if(error)return toast(error.message);
 const bulk=me.role==='superadmin'?`<div class="bulkBox"><h3 style="margin:0 0 8px">대원 일괄등록</h3><p class="muted">엑셀 명단을 CSV(UTF-8)로 저장해 업로드하면 로그인 계정과 대원 프로필을 한꺼번에 생성합니다. 필수 열: 이름, 직분, 파트, 휴대전화번호 · 초기비밀번호: Somang!+휴대전화 끝 4자리 · 첫 로그인 후 비밀번호 변경 필수</p><div class="bulkToolbar"><button class="btn" onclick="downloadMemberTemplate()">CSV 양식 다운로드</button><label class="btn primary" style="cursor:pointer">CSV 파일 선택<input id="bulkMemberFile" type="file" accept=".csv,text/csv" hidden onchange="previewBulkMembers(this.files[0])"></label><button id="bulkRunBtn" class="btn ok" style="display:none" onclick="runBulkMembers()">검토한 대원 일괄등록</button><button id="bulkResultBtn" class="btn" style="display:none" onclick="downloadBulkResults()">등록 결과 CSV</button></div><div id="bulkMemberPreview"></div></div>`:'';

function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function downloadTextFile(name,text,type='text/csv;charset=utf-8'){const b=new Blob(['\ufeff'+text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},100)}
function downloadMemberTemplate(){downloadTextFile('somang_members_template.csv','이름,직분,파트,휴대전화번호\n홍길동,집사,Tenor,01012345678\n김영희,권사,Soprano,01023456789')}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}else cell+=c}row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
function normalizePart(v){const s=String(v||'').trim().toLowerCase();const m={soprano:'Soprano','소프라노':'Soprano',s:'Soprano',alto:'Alto','알토':'Alto',a:'Alto',tenor:'Tenor','테너':'Tenor',t:'Tenor',bass:'Bass','베이스':'Bass','베이스파트':'Bass',b:'Bass'};return m[s]||''}
async function previewBulkMembers(file){
 if(!file)return;let text=await file.text();text=text.replace(/^\ufeff/,'');const rows=parseCSV(text);if(rows.length<2){bulkMembersDraft=[];return toast('등록할 대원 행이 없습니다.');}
 const head=rows[0].map(x=>x.trim().replace(/\s/g,''));const aliases={name:['이름','성명','name'],title:['직분','호칭','title'],part:['파트','part'],phone:['휴대전화번호','휴대폰','전화번호','phone']};
 const idx={};for(const [k,arr] of Object.entries(aliases)){idx[k]=head.findIndex(h=>arr.some(a=>h.toLowerCase()===a.toLowerCase().replace(/\s/g,'')))}
 if(Object.values(idx).some(i=>i<0)){bulkMembersDraft=[];return toast('CSV 첫 줄에 이름, 직분, 파트, 휴대전화번호가 필요합니다.');}
 const seen=new Set();bulkMembersDraft=rows.slice(1).map((r,i)=>{const phone=normalizePhone(r[idx.phone]||''),part=normalizePart(r[idx.part]||''),name=(r[idx.name]||'').trim(),title=(r[idx.title]||'').trim();const errs=[];if(!name)errs.push('이름 없음');if(!title)errs.push('직분 없음');if(!part)errs.push('파트 확인');if(!/^010\d{8}$/.test(phone))errs.push('휴대전화번호 확인');if(seen.has(phone))errs.push('파일 내 중복번호');seen.add(phone);return {row:i+2,name,title,part,phone,valid:!errs.length,error:errs.join(', ')}});
 const ok=bulkMembersDraft.filter(x=>x.valid).length,bad=bulkMembersDraft.length-ok;document.getElementById('bulkMemberPreview').innerHTML=`<div class="muted" style="margin-top:10px">총 ${bulkMembersDraft.length}명 · <span class="bulkGood">정상 ${ok}</span> · <span class="bulkBad">확인 필요 ${bad}</span></div><div class="bulkPreview"><table><thead><tr><th>행</th><th>이름</th><th>직분</th><th>파트</th><th>휴대전화</th><th>검사</th></tr></thead><tbody>${bulkMembersDraft.map(x=>`<tr><td>${x.row}</td><td>${esc(x.name)}</td><td>${esc(x.title)}</td><td>${esc(x.part||'-')}</td><td>${esc(phoneDisplay(x.phone))}</td><td class="${x.valid?'bulkGood':'bulkBad'}">${x.valid?'정상':esc(x.error)}</td></tr>`).join('')}</tbody></table></div>`;const btn=document.getElementById('bulkRunBtn');btn.style.display=(ok&&bad===0)?'inline-flex':'none';
}
async function runBulkMembers(){
 if(me.role!=='superadmin')return toast('최고관리자만 일괄등록할 수 있습니다.');const members=bulkMembersDraft.filter(x=>x.valid).map(({name,title,part,phone})=>({name,title,part,phone}));if(!members.length)return toast('등록할 대원이 없습니다.');if(!confirm(`${members.length}명의 로그인 계정과 대원 프로필을 생성하시겠습니까?`))return;
 const btn=document.getElementById('bulkRunBtn');if(btn){btn.disabled=true;btn.textContent='등록 중…'}
 try{const {data,error}=await sb.functions.invoke('bulk-register-members',{body:{members}});if(error)throw error;bulkLastResults=data?.results||[];const success=bulkLastResults.filter(x=>x.status==='created').length,skip=bulkLastResults.filter(x=>x.status==='skipped').length,fail=bulkLastResults.filter(x=>x.status==='failed').length;document.getElementById('bulkResultBtn').style.display='inline-flex';toast(`완료: 생성 ${success} · 중복 ${skip} · 실패 ${fail}`);await manageMembers();setTimeout(()=>{const r=document.getElementById('bulkResultBtn');if(r)r.style.display='inline-flex'},0)}catch(e){toast('일괄등록 실패: '+(e?.message||e))}finally{if(btn){btn.disabled=false;btn.textContent='검토한 대원 일괄등록'}}
}
function downloadBulkResults(){if(!bulkLastResults.length)return toast('다운로드할 결과가 없습니다.');const lines=['이름,파트,휴대전화번호,처리결과,초기비밀번호,메시지',...bulkLastResults.map(x=>[x.name,x.part,x.phone,x.status,x.temp_password||'',x.message||''].map(csvCell).join(','))];downloadTextFile('somang_members_registration_results.csv',lines.join('\n'))}


async function resetMemberPassword(id,name,phone){
  if(!(me.role==='superadmin'||can('members')))return toast('대원 관리 권한이 필요합니다.');
  const suffix=normalizePhone(phone).slice(-4);
  const temp=`Somang!${suffix}`;
  if(!confirm(`${name} 대원의 비밀번호를 초기화하시겠습니까?\n\n초기비밀번호: ${temp}\n다음 로그인 때 새 비밀번호 설정이 필요합니다.`))return;
  try{
    const {data,error}=await sb.functions.invoke('reset-member-password',{body:{user_id:id}});
    if(error)throw error;
    if(data?.error)throw new Error(data.error);
    toast(`${name} 대원의 비밀번호를 초기화했습니다. (${data?.temp_password||temp})`);
  }catch(e){toast('비밀번호 초기화 실패: '+(e?.message||e))}
}

async function compressProfileImage(file,maxSize=700,quality=.82){
  const bitmap=await createImageBitmap(file);
  let w=bitmap.width,h=bitmap.height;
  const scale=Math.min(1,maxSize/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0,w,h);
  if(bitmap.close)bitmap.close();
  return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('사진 변환 실패')),'image/jpeg',quality));
}
async function uploadMyProfilePhoto(file){
  const blob=await compressProfileImage(file);
  const path=`${me.id}/avatar.jpg`;
  const {error}=await sb.storage.from('profile-photos').upload(path,blob,{upsert:true,contentType:'image/jpeg',cacheControl:'3600'});
  if(error)throw error;
  return path;
}

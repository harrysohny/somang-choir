<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>소망 찬양대 · SOMANG CHOIR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#2d5b52;--brand2:#eaf2ef;--danger:#b42318;--ok:#16794a;--shadow:0 10px 30px rgba(0,0,0,.07)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:1050px;margin:0 auto;min-height:100vh;background:var(--bg)}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}.brand b{font-size:19px}.brand small{display:block;color:var(--muted);margin-top:2px}.topbtn{border:0;background:var(--brand2);color:var(--brand);padding:9px 12px;border-radius:10px;font-weight:700}main{padding:18px 18px 90px}.hero{background:linear-gradient(135deg,#244d46,#4f756d);color:#fff;border-radius:22px;padding:24px;box-shadow:var(--shadow)}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;opacity:.88}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.035)}.card h3{margin:0 0 8px}.muted{color:var(--muted);font-size:14px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--brand2);color:var(--brand);font-size:12px;font-weight:700}.important{background:#fff2f0;color:#b42318}.list{display:grid;gap:10px}.row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.rowhead{display:flex;justify-content:space-between;gap:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:10px;padding:9px 12px;background:#eef1f4;color:#29313d;font-weight:700}.btn.primary{background:var(--brand);color:#fff}.btn.danger{background:#fff1f0;color:var(--danger)}.btn.ok{background:#ebf8f1;color:var(--ok)}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}.sectiontitle h2{margin:0;font-size:21px}.loginwrap{max-width:520px;margin:36px auto}.loginbox{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}.loginbox h1{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d6dae0;border-radius:11px;padding:12px;background:#fff}.field textarea{min-height:110px;resize:vertical}.wide{width:100%}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}.statusbox{padding:18px;border-radius:16px;background:#fff;border:1px solid var(--line)}nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.98);border-top:1px solid var(--line);z-index:20}.navin{max-width:1050px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}nav button{border:0;background:transparent;padding:11px 4px 12px;color:#6b7280;font-size:12px}nav button b{display:block;font-size:17px;margin-bottom:2px}nav button.active{color:var(--brand);font-weight:800}.adminGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.adminTile{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;text-align:left}.adminTile b{display:block;margin-bottom:5px}.membergrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.member{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.member .name{font-weight:800;font-size:17px}.link{color:#245f9b;text-decoration:none;font-weight:700}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#20252b;color:#fff;padding:10px 14px;border-radius:10px;z-index:99;display:none;max-width:85%;text-align:center}.codehint{font-size:12px;color:#70757d;background:#f7f8fa;border-radius:9px;padding:8px;margin-top:10px}@media(max-width:720px){.grid,.membergrid{grid-template-columns:1fr}.adminGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:20px}.head{padding:12px 14px}main{padding:14px 14px 90px}}
</style>
</head>
<body><div class="app"><header><div class="head"><div class="brand"><b>소망 찬양대</b><small>SOMANG CHOIR</small></div><button id="headerBtn" class="topbtn" onclick="headerAction()">로그인</button></div></header><main id="main"></main></div><nav id="nav" style="display:none"><div class="navin"><button onclick="go('home')" data-page="home"><b>⌂</b>홈</button><button onclick="go('songs')" data-page="songs"><b>♫</b>찬양</button><button onclick="go('prayers')" data-page="prayers"><b>♡</b>기도</button><button onclick="go('members')" data-page="members"><b>♙</b>대원</button><button onclick="go('more')" data-page="more"><b>☰</b>더보기</button></div></nav><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://chsfhwewskydnreodvvq.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_MoLRdCftzWbvdGkWyeGoEg_My1j8-XB';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let session=null, me=null, perms=[], page='home';
const PERM_LABELS={members:'대원명단/가입승인',notices:'공지 관리',songs:'찬양곡·YouTube 영상',prayers:'기도당번',events:'일정·행사',intro:'찬양대 소개',leaders:'섬기는 분들',gallery:'갤러리',documents:'자료실',polls:'투표·설문',tasks:'봉사·할일',permissions:'관리자 권한'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('ko-KR'):'';
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function normalizePhone(v){let d=(v||'').replace(/\D/g,'');if(d.startsWith('82')) d='0'+d.slice(2);return d}
function phoneDisplay(v){const d=normalizePhone(v);return d.length===11?`${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`:d}
function aliasEmail(phone){return normalizePhone(phone)+'@somangchoir.app'}
function can(p){return me?.role==='superadmin'||perms.includes(p)}
function headerAction(){if(!session) return renderAuth(); if(confirm('로그아웃하시겠습니까?')) logout()}
async function logout(){await sb.auth.signOut();session=null;me=null;perms=[];renderAuth()}
async function init(){const {data}=await sb.auth.getSession();session=data.session; if(session) await loadMe(); else renderAuth(); sb.auth.onAuthStateChange(async(_e,s)=>{session=s;if(s) await loadMe();else renderAuth()})}
async function loadMe(){const uid=session.user.id;const {data,error}=await sb.from('profiles').select('*').eq('id',uid).single();if(error){main.innerHTML=`<div class="statusbox">프로필을 불러오지 못했습니다.<br>${esc(error.message)}</div>`;return}me=data;const pr=await sb.from('user_permissions').select('permission').eq('user_id',uid);perms=(pr.data||[]).map(x=>x.permission);document.getElementById('headerBtn').textContent='로그아웃';if(me.status==='approved'){document.getElementById('nav').style.display='block';go(page||'home')}else{document.getElementById('nav').style.display='none';renderPending()}}
function renderPending(){const st={pending:'승인 대기 중',rejected:'가입 신청이 반려되었습니다',inactive:'현재 이용이 중지된 계정입니다'}[me.status]||me.status;main.innerHTML=`<div class="loginwrap"><div class="loginbox"><h1>${st}</h1><p><b>${esc(me.name)}</b> 님의 가입 정보가 등록되었습니다.</p><p class="muted">소망 찬양대 관리자가 확인 후 승인하면 전체 메뉴를 사용할 수 있습니다.</p><div class="codehint">휴대전화번호: ${esc(phoneDisplay(me.phone))} · 파트: ${esc(me.part||'-')}</div><button class="btn wide" style="margin-top:16px" onclick="logout()">로그아웃</button></div></div>`}
function renderAuth(){document.getElementById('headerBtn').textContent='로그인';document.getElementById('nav').style.display='none';main.innerHTML=`<div class="loginwrap"><div class="loginbox"><h1>소망 찬양대</h1><p class="muted">대원 전용 소통·관리 앱</p><div class="tabs"><button class="btn primary" onclick="showLogin()">로그인</button><button class="btn" onclick="showSignup()">가입 신청</button></div><div id="authBody"></div></div></div>`;showLogin()}
function showLogin(){authBody.innerHTML=`<div class="field"><label>휴대전화번호</label><input id="lphone" inputmode="tel" placeholder="010-1234-5678"></div><div class="field"><label>비밀번호</label><input id="lpw" type="password" placeholder="비밀번호"></div><button class="btn primary wide" onclick="doLogin()">로그인</button><p class="muted" style="margin-top:14px">비밀번호를 잊은 경우 총무/관리자에게 본인 확인 후 재설정을 요청해 주세요.</p>`}
function showSignup(){authBody.innerHTML=`<div class="field"><label>이름</label><input id="sname" placeholder="홍길동"></div><div class="field"><label>직분/호칭</label><input id="stitle" placeholder="집사, 권사, 장로 등"></div><div class="field"><label>파트</label><select id="spart"><option>Soprano</option><option>Alto</option><option>Tenor</option><option>Bass</option></select></div><div class="field"><label>휴대전화번호</label><input id="sphone" inputmode="tel" placeholder="010-1234-5678"></div><div class="field"><label>비밀번호 (6자 이상)</label><input id="spw" type="password"></div><div class="field"><label>비밀번호 확인</label><input id="spw2" type="password"></div><button class="btn primary wide" onclick="doSignup()">가입 신청</button><p class="muted">가입 후 관리자 승인을 받아야 대원 전용 메뉴가 열립니다.</p>`}
async function doLogin(){const p=normalizePhone(lphone.value),pw=lpw.value;if(p.length<10)return toast('휴대전화번호를 확인해 주세요.');const {error}=await sb.auth.signInWithPassword({email:aliasEmail(p),password:pw});if(error)toast('로그인 실패: '+error.message)}
async function doSignup(){const p=normalizePhone(sphone.value),pw=spw.value;if(!sname.value.trim())return toast('이름을 입력해 주세요.');if(p.length<10)return toast('휴대전화번호를 확인해 주세요.');if(pw.length<6)return toast('비밀번호는 6자 이상입니다.');if(pw!==spw2.value)return toast('비밀번호가 서로 다릅니다.');const {error}=await sb.auth.signUp({email:aliasEmail(p),password:pw,options:{data:{name:sname.value.trim(),title:stitle.value.trim(),part:spart.value,phone:p}}});if(error)return toast('가입 실패: '+error.message);toast('가입 신청이 등록되었습니다.');setTimeout(()=>showLogin(),900)}
function navActive(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
async function go(p){page=p;navActive();main.innerHTML='<div class="empty">불러오는 중…</div>';const f={home:homePage,songs:songsPage,prayers:prayerPage,members:membersPage,more:morePage,notices:noticesPage,events:eventsPage,intro:introPage,leaders:leadersPage,gallery:galleryPage,documents:documentsPage,polls:pollsPage,tasks:tasksPage,admin:adminPage}[p];if(f)await f()}
async function homePage(){const [n,s,e,p]=await Promise.all([sb.from('notices').select('*').order('important',{ascending:false}).order('notice_date',{ascending:false}).limit(4),sb.from('songs').select('*').gte('service_date',new Date().toISOString().slice(0,10)).order('service_date').limit(2),sb.from('events').select('*').gte('event_date',new Date().toISOString().slice(0,10)).order('event_date').limit(3),sb.from('prayer_assignments').select('*').gte('sunday_date',new Date().toISOString().slice(0,10)).order('sunday_date').limit(1)]);main.innerHTML=`<div class="hero"><h1>${esc(me.name)} 님, 반갑습니다</h1><p>${esc(me.part||'')} · ${esc(me.title||'대원')} · 함께 드리는 찬양</p></div><div class="grid"><div class="card"><h3>최근 공지</h3>${(n.data||[]).map(x=>`<div style="margin:9px 0"><span class="tag ${x.important?'important':''}">${esc(x.scope)}</span> <b>${esc(x.title)}</b><div class="muted">${fmt(x.notice_date)}</div></div>`).join('')||'<div class="muted">등록된 공지가 없습니다.</div>'}</div><div class="card"><h3>다가오는 찬양</h3>${(s.data||[]).map(x=>`<div style="margin:9px 0"><b>${fmt(x.service_date)} · ${esc(x.title)}</b><div class="actions">${linkBtn(x.full_url,'전체 합창')}${me.part==='Soprano'?linkBtn(x.soprano_url,'내 파트'):me.part==='Alto'?linkBtn(x.alto_url,'내 파트'):me.part==='Tenor'?linkBtn(x.tenor_url,'내 파트'):me.part==='Bass'?linkBtn(x.bass_url,'내 파트'):''}</div></div>`).join('')||'<div class="muted">예정곡이 없습니다.</div>'}</div><div class="card"><h3>이번 주 기도당번</h3>${(p.data||[]).map(x=>`<b>목요일 ${fmt(x.thursday_date)}</b><div class="muted">시작 ${esc(x.thursday_start||'-')} · 마침 ${esc(x.thursday_end||'-')}</div><div style="height:8px"></div><b>주일 ${fmt(x.sunday_date)}</b><div class="muted">시작 ${esc(x.sunday_start||'-')} · 마침 ${esc(x.sunday_end||'-')}</div>`).join('')||'<div class="muted">등록된 기도당번이 없습니다.</div>'}</div><div class="card"><h3>다가오는 일정</h3>${(e.data||[]).map(x=>`<div style="margin:8px 0"><b>${fmt(x.event_date)} ${esc(x.title)}</b><div class="muted">${esc(x.place||'')}</div></div>`).join('')||'<div class="muted">등록된 일정이 없습니다.</div>'}</div><div class="card"><h3>정기 연습</h3><b>목요일 19:30–21:00</b><div class="muted">시작기도 · 마침기도</div><br><b>주일 08:00–08:45 / 10:40–12:00</b><div class="muted">시작기도 · 마침기도</div></div></div>`}
async function noticesPage(){const {data}=await sb.from('notices').select('*').order('notice_date',{ascending:false});main.innerHTML=title('공지사항')+list((data||[]).map(x=>`<div class="row"><div class="rowhead"><div><span class="tag ${x.important?'important':''}">${esc(x.scope)}</span> <b>${esc(x.title)}</b></div><span class="muted">${fmt(x.notice_date)}</span></div><div style="margin-top:8px">${esc(x.body||'').replace(/\n/g,'<br>')}</div></div>`))}
async function songsPage(){const {data}=await sb.from('songs').select('*').order('service_date',{ascending:false});const today=new Date().toISOString().slice(0,10);const rows=(data||[]).map(x=>{const upcoming=(x.service_date||'')>=today;const myPart={Soprano:['soprano_url','Soprano'],Alto:['alto_url','Alto'],Tenor:['tenor_url','Tenor'],Bass:['bass_url','Bass']}[me.part];const mine=myPart&&x[myPart[0]]?`<a class="btn primary" target="_blank" rel="noopener" href="${esc(x[myPart[0]])}">내 파트 ${myPart[1]}</a>`:'';return `<div class="row"><div class="rowhead"><div><span class="tag">${upcoming?'예정':'지난 찬양'}</span> <b>${fmt(x.service_date)} · ${esc(x.title)}</b><div class="muted">${esc(x.category||'주일찬양')}</div></div></div><div class="actions">${mine}${linkBtn(x.full_url,'전체 합창')}${linkBtn(x.soprano_url,'Soprano')}${linkBtn(x.alto_url,'Alto')}${linkBtn(x.tenor_url,'Tenor')}${linkBtn(x.bass_url,'Bass')}${linkBtn(x.live_url,'실제 주일찬양')}</div></div>`});main.innerHTML=title('찬양 · 연습영상')+`<p class="muted">전체 합창과 파트별 연습영상은 YouTube 링크로 연결됩니다. 지난 찬양도 삭제하지 않고 기록으로 보관됩니다.</p>`+list(rows)}
function linkBtn(u,t){return u?`<a class="btn link" href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`:''}
async function prayerPage(){const {data}=await sb.from('prayer_assignments').select('*').order('thursday_date',{ascending:false}).limit(20);main.innerHTML=title('기도당번')+list((data||[]).map(x=>`<div class="row"><b>목요일 ${fmt(x.thursday_date)}</b><div class="muted">시작기도 ${esc(x.thursday_start||'-')} · 마침기도 ${esc(x.thursday_end||'-')}</div><div style="height:8px"></div><b>주일 ${fmt(x.sunday_date)}</b><div class="muted">시작기도 ${esc(x.sunday_start||'-')} · 마침기도 ${esc(x.sunday_end||'-')}</div></div>`))}
async function membersPage(){const {data}=await sb.from('profiles').select('id,name,title,part,phone,role,status').eq('status','approved').order('part').order('name');main.innerHTML=title('대원명단')+`<div class="membergrid">${(data||[]).map(x=>`<div class="member"><div class="name">${esc(x.name)}</div><span class="tag">${esc(x.part||'-')}</span><div class="muted" style="margin-top:7px">${esc(x.title||'대원')}</div><div style="margin-top:8px">${esc(phoneDisplay(x.phone))}</div></div>`).join('')||'<div class="empty">대원이 없습니다.</div>'}</div>`}
async function eventsPage(){const {data}=await sb.from('events').select('*').order('event_date',{ascending:false});main.innerHTML=title('일정 · 행사')+list((data||[]).map(x=>`<div class="row"><b>${fmt(x.event_date)} ${esc(x.event_time||'')} · ${esc(x.title)}</b><div class="muted">${esc(x.place||'')}</div><div>${esc(x.description||'')}</div></div>`))}
async function introPage(){const {data}=await sb.from('choir_intro').select('*').eq('id',1).single();main.innerHTML=title('찬양대 소개')+`<div class="card"><h3>${esc(data?.name||'소망 찬양대')} <span class="muted">${esc(data?.english_name||'')}</span></h3><p>${esc(data?.description||'')}</p><p><b>예배</b><br>${esc(data?.service||'')}</p><p><b>연습</b><br>${esc(data?.rehearsal||'')}</p><p><b>역사</b><br>${esc(data?.history||'')}</p><p><b>비전</b><br>${esc(data?.vision||'')}</p></div>`}
async function leadersPage(){const {data}=await sb.from('leaders').select('*').order('sort_order');main.innerHTML=title('섬기는 분들')+`<div class="membergrid">${(data||[]).map(x=>`<div class="member"><div class="muted">${esc(x.role_name)}</div><div class="name">${esc(x.name)}</div></div>`).join('')||'<div class="empty">등록된 정보가 없습니다.</div>'}</div>`}
async function galleryPage(){const {data}=await sb.from('gallery').select('*').order('event_date',{ascending:false});main.innerHTML=title('갤러리')+list((data||[]).map(x=>`<div class="row"><b>${esc(x.title)}</b><div class="muted">${fmt(x.event_date)}</div><p>${esc(x.description||'')}</p>${linkBtn(x.cover_path,'사진 보기')}</div>`))}
async function documentsPage(){const {data}=await sb.from('documents').select('*').order('document_date',{ascending:false});main.innerHTML=title('자료실')+list((data||[]).map(x=>`<div class="row"><span class="tag">${esc(x.category||'자료')}</span> <b>${esc(x.title)}</b><div class="muted">${fmt(x.document_date)}</div><p>${esc(x.description||'')}</p><div class="actions">${linkBtn(x.file_path||x.external_url,'자료 열기')}</div></div>`))}
async function pollsPage(){const {data}=await sb.from('polls').select('*,poll_options(*)').order('created_at',{ascending:false});main.innerHTML=title('투표 · 설문')+list((data||[]).map(x=>`<div class="row"><b>${esc(x.title)}</b><div class="muted">${esc(x.status)} ${x.end_date?'· '+fmt(x.end_date):''}</div><div class="actions">${(x.poll_options||[]).sort((a,b)=>a.sort_order-b.sort_order).map(o=>`<button class="btn" onclick="vote('${x.id}','${o.id}')">${esc(o.option_text)}</button>`).join('')}</div></div>`))}
async function vote(pid,oid){await sb.from('poll_votes').delete().eq('poll_id',pid).eq('user_id',me.id);const {error}=await sb.from('poll_votes').insert({poll_id:pid,option_id:oid,user_id:me.id});toast(error?error.message:'투표했습니다.')}
async function tasksPage(){const {data}=await sb.from('tasks').select('*').order('due_date',{ascending:true});main.innerHTML=title('봉사 · 할일')+list((data||[]).map(x=>`<div class="row"><b>${esc(x.title)}</b> <span class="tag">${esc(x.status)}</span><div class="muted">${fmt(x.due_date)} · 담당 ${esc(x.assignee||'-')}</div><div>${esc(x.note||'')}</div></div>`))}
function morePage(){const admin=me.role==='superadmin'||Object.keys(PERM_LABELS).some(can);main.innerHTML=title('더보기')+`<div class="grid"><button class="adminTile" onclick="go('notices')"><b>공지사항</b><span class="muted">전체/파트 공지</span></button><button class="adminTile" onclick="go('events')"><b>일정 · 행사</b><span class="muted">연습·행사 일정</span></button><button class="adminTile" onclick="go('intro')"><b>찬양대 소개</b><span class="muted">소개·역사·비전</span></button><button class="adminTile" onclick="go('leaders')"><b>섬기는 분들</b><span class="muted">대장·지휘자·반주·총무 등</span></button><button class="adminTile" onclick="go('gallery')"><b>갤러리</b><span class="muted">행사·절기·연습 사진</span></button><button class="adminTile" onclick="go('documents')"><b>자료실</b><span class="muted">문서·링크</span></button><button class="adminTile" onclick="go('polls')"><b>투표 · 설문</b><span class="muted">대원 의견 수렴</span></button><button class="adminTile" onclick="go('tasks')"><b>봉사 · 할일</b><span class="muted">업무·봉사 배정</span></button>${admin?`<button class="adminTile" onclick="go('admin')"><b>⚙ 관리센터</b><span class="muted">가입 승인 및 콘텐츠 관리</span></button>`:''}</div>`}
async function adminPage(){const tiles=[['members','가입 승인/대원'],['notices','공지'],['songs','찬양곡'],['prayers','기도당번'],['events','일정·행사'],['intro','찬양대 소개'],['leaders','섬기는 분들'],['gallery','갤러리'],['documents','자료실'],['polls','투표·설문'],['tasks','봉사·할일'],['permissions','권한 부여']].filter(([p])=>can(p));main.innerHTML=title('통합 관리센터')+`<div class="adminGrid">${tiles.map(([p,l])=>`<button class="adminTile" onclick="manage('${p}')"><b>${l}</b><span class="muted">등록 · 수정 · 삭제</span></button>`).join('')}</div><p class="muted" style="margin-top:18px">모든 운영 데이터 입력은 이 관리센터에서 처리합니다. 출석/회계 기능은 포함하지 않습니다.</p>`}
async function manage(type){if(type==='members')return manageMembers();if(type==='permissions')return managePermissions();if(type==='intro')return editIntro();const map={notices:'notices',songs:'songs',prayers:'prayer_assignments',events:'events',leaders:'leaders',gallery:'gallery',documents:'documents',polls:'polls',tasks:'tasks'};const table=map[type];if(!table)return;const {data}=await sb.from(table).select('*').order('created_at',{ascending:false}).limit(100);main.innerHTML=title('관리 · '+(PERM_LABELS[type]||type),`<button class="btn primary" onclick="addRecord('${type}')">+ 새로 등록</button>`)+list((data||[]).map(x=>`<div class="row"><b>${esc(recordTitle(type,x))}</b><div class="muted">${esc(recordSub(type,x))}</div><div class="actions"><button class="btn" onclick='editRecord(${JSON.stringify(type)},${JSON.stringify(x)})'>수정</button><button class="btn danger" onclick="deleteRecord('${type}','${x.id}')">삭제</button></div></div>`))}
function recordTitle(t,x){return x.title||x.name||x.role_name||((t==='prayers')?`${x.thursday_date} / ${x.sunday_date}`:'항목')}
function recordSub(t,x){return x.notice_date||x.service_date||x.event_date||x.document_date||x.due_date||x.category||x.scope||''}
const FIELDS={
notices:[['scope','범위','select','전체|Soprano|Alto|Tenor|Bass'],['title','제목'],['body','내용','textarea'],['notice_date','공지일','date'],['important','중요공지','checkbox']],
songs:[['service_date','찬양일','date'],['category','구분'],['title','찬양곡'],['full_url','전체 합창 YouTube 링크'],['soprano_url','Soprano YouTube 링크'],['alto_url','Alto YouTube 링크'],['tenor_url','Tenor YouTube 링크'],['bass_url','Bass YouTube 링크'],['live_url','실제 주일찬양 YouTube 링크']],
prayers:[['thursday_date','목요일 날짜','date'],['sunday_date','주일 날짜','date'],['thursday_start','목요일 시작기도'],['thursday_end','목요일 마침기도'],['sunday_start','주일 시작기도'],['sunday_end','주일 마침기도']],
events:[['event_date','날짜','date'],['event_time','시간','time'],['title','행사명'],['place','장소'],['description','설명','textarea']],
leaders:[['role_name','역할'],['name','이름'],['photo_path','사진 URL'],['sort_order','표시순서','number']],
gallery:[['event_date','행사일','date'],['title','앨범 제목'],['description','설명','textarea'],['cover_path','대표사진 URL']],
documents:[['document_date','날짜','date'],['category','분류'],['title','제목'],['file_path','파일 URL'],['external_url','외부 링크'],['description','설명','textarea']],
polls:[['title','설문 제목'],['end_date','마감일','date'],['status','상태','select','진행중|마감']],
tasks:[['due_date','기한','date'],['title','할일'],['assignee','담당자'],['status','상태','select','진행중|완료|보류'],['note','메모','textarea']]
};
function formHTML(type,obj={}){return (FIELDS[type]||[]).map(([k,l,kind='text',opts=''])=>{const v=obj[k]??'';if(kind==='textarea')return `<div class="field"><label>${l}</label><textarea id="f_${k}">${esc(v)}</textarea></div>`;if(kind==='select')return `<div class="field"><label>${l}</label><select id="f_${k}">${opts.split('|').map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select></div>`;if(kind==='checkbox')return `<div class="field"><label><input id="f_${k}" type="checkbox" ${v?'checked':''}> ${l}</label></div>`;return `<div class="field"><label>${l}</label><input id="f_${k}" type="${kind}" value="${esc(v)}"></div>`}).join('')}
function collect(type){const o={};for(const [k,,kind='text'] of FIELDS[type]||[]){const e=document.getElementById('f_'+k);o[k]=kind==='checkbox'?e.checked:kind==='number'?(e.value?Number(e.value):null):(e.value||null)}return o}
async function prayerFormHTML(obj={}){const {data}=await sb.from('profiles').select('name,part').eq('status','approved').order('name');const names=(data||[]);const sel=(k,l)=>`<div class="field"><label>${l}</label><select id="f_${k}"><option value="">선택</option>${names.map(m=>`<option value="${esc(m.name)}" ${m.name===(obj[k]||'')?'selected':''}>${esc(m.name)} · ${esc(m.part||'')}</option>`).join('')}</select></div>`;return `<div class="field"><label>목요일 날짜</label><input id="f_thursday_date" type="date" value="${esc(obj.thursday_date||'')}"></div><div class="field"><label>주일 날짜</label><input id="f_sunday_date" type="date" value="${esc(obj.sunday_date||'')}"></div>${sel('thursday_start','목요일 시작기도')}${sel('thursday_end','목요일 마침기도')}${sel('sunday_start','주일 시작기도')}${sel('sunday_end','주일 마침기도')}`;}
async function addRecord(type){const html=type==='prayers'?await prayerFormHTML():formHTML(type);main.innerHTML=title('새로 등록')+`<div class="card">${html}<button class="btn primary" onclick="saveNew('${type}')">저장</button> <button class="btn" onclick="manage('${type}')">취소</button></div>`}
async function editRecord(type,obj){window._editObj=obj;const html=type==='prayers'?await prayerFormHTML(obj):formHTML(type,obj);main.innerHTML=title('수정')+`<div class="card">${html}<button class="btn primary" onclick="saveEdit('${type}','${obj.id}')">저장</button> <button class="btn" onclick="manage('${type}')">취소</button></div>`}
async function saveNew(type){const map={notices:'notices',songs:'songs',prayers:'prayer_assignments',events:'events',leaders:'leaders',gallery:'gallery',documents:'documents',polls:'polls',tasks:'tasks'};const o=collect(type);if(['notices','songs','prayers','events','leaders','gallery','documents','polls','tasks'].includes(type))o.created_by=me.id;const {error}=await sb.from(map[type]).insert(o);if(error)return toast(error.message);toast('저장되었습니다.');manage(type)}
async function saveEdit(type,id){const map={notices:'notices',songs:'songs',prayers:'prayer_assignments',events:'events',leaders:'leaders',gallery:'gallery',documents:'documents',polls:'polls',tasks:'tasks'};const {error}=await sb.from(map[type]).update(collect(type)).eq('id',id);if(error)return toast(error.message);toast('수정되었습니다.');manage(type)}
async function deleteRecord(type,id){if(!confirm('삭제하시겠습니까?'))return;const map={notices:'notices',songs:'songs',prayers:'prayer_assignments',events:'events',leaders:'leaders',gallery:'gallery',documents:'documents',polls:'polls',tasks:'tasks'};const {error}=await sb.from(map[type]).delete().eq('id',id);if(error)return toast(error.message);toast('삭제되었습니다.');manage(type)}
async function manageMembers(){const {data}=await sb.from('profiles').select('*').order('created_at',{ascending:false});main.innerHTML=title('가입 승인 · 대원 관리')+list((data||[]).map(x=>`<div class="row"><b>${esc(x.name)}</b> <span class="tag">${esc(x.part||'-')}</span><div class="muted">${esc(phoneDisplay(x.phone))} · ${esc(x.title||'')} · ${esc(x.status)} · ${esc(x.role)}</div><div class="actions">${x.status!=='approved'?`<button class="btn ok" onclick="setStatus('${x.id}','approved')">승인</button>`:''}${x.status==='approved'?`<button class="btn" onclick="setStatus('${x.id}','inactive')">중지</button>`:''}<button class="btn danger" onclick="setStatus('${x.id}','rejected')">반려</button>${me.role==='superadmin'?`<button class="btn" onclick="setRolePrompt('${x.id}','${x.role}')">역할</button>`:''}</div></div>`))}
async function setStatus(id,st){const {error}=await sb.rpc('admin_set_member_status',{p_user_id:id,p_status:st});if(error)return toast(error.message);toast('처리되었습니다.');manageMembers()}
async function setRolePrompt(id,cur){const r=prompt('역할을 입력하세요: member / manager / superadmin',cur);if(!r)return;const {error}=await sb.rpc('superadmin_set_member_role',{p_user_id:id,p_role:r});if(error)return toast(error.message);toast('역할이 변경되었습니다.');manageMembers()}
async function managePermissions(){if(me.role!=='superadmin')return toast('최고관리자만 가능합니다.');const {data}=await sb.from('profiles').select('id,name,part,status,role').eq('status','approved').order('name');main.innerHTML=title('관리자 권한 부여')+list((data||[]).map(x=>`<div class="row"><b>${esc(x.name)}</b> <span class="tag">${esc(x.role)}</span><div class="muted">${esc(x.part||'')}</div><div class="actions"><button class="btn" onclick="editPerms('${x.id}','${esc(x.name)}')">세부 권한 설정</button></div></div>`))}
async function editPerms(id,name){const {data}=await sb.from('user_permissions').select('permission').eq('user_id',id);const cur=(data||[]).map(x=>x.permission);main.innerHTML=title(name+' 권한')+`<div class="card">${Object.entries(PERM_LABELS).filter(([k])=>k!=='permissions').map(([k,l])=>`<div class="field"><label><input type="checkbox" class="permcheck" value="${k}" ${cur.includes(k)?'checked':''}> ${l}</label></div>`).join('')}<button class="btn primary" onclick="savePerms('${id}')">저장</button> <button class="btn" onclick="managePermissions()">취소</button></div>`}
async function savePerms(id){const arr=[...document.querySelectorAll('.permcheck:checked')].map(x=>x.value);const {error}=await sb.rpc('superadmin_set_permissions',{p_user_id:id,p_permissions:arr});if(error)return toast(error.message);toast('권한이 저장되었습니다.');managePermissions()}
async function editIntro(){const {data}=await sb.from('choir_intro').select('*').eq('id',1).single();main.innerHTML=title('찬양대 소개 수정')+`<div class="card">${[['name','이름'],['english_name','영문명'],['description','소개'],['founded','창단/역사 요약'],['service','예배'],['rehearsal','연습'],['history','역사'],['vision','비전']].map(([k,l])=>`<div class="field"><label>${l}</label>${['description','history','vision'].includes(k)?`<textarea id="i_${k}">${esc(data?.[k]||'')}</textarea>`:`<input id="i_${k}" value="${esc(data?.[k]||'')}">`}</div>`).join('')}<button class="btn primary" onclick="saveIntro()">저장</button></div>`}
async function saveIntro(){const o={};['name','english_name','description','founded','service','rehearsal','history','vision'].forEach(k=>o[k]=document.getElementById('i_'+k).value);o.updated_by=me.id;o.updated_at=new Date().toISOString();const {error}=await sb.from('choir_intro').update(o).eq('id',1);if(error)return toast(error.message);toast('저장되었습니다.');go('intro')}
function title(t,right=''){return `<div class="sectiontitle"><h2>${esc(t)}</h2><div>${right}</div></div>`}
function list(a){return `<div class="list">${a.join('')||'<div class="empty">등록된 내용이 없습니다.</div>'}</div>`}
init();
</script></body></html>

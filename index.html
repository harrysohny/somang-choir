function youtubeId(url){
  try{
    const u=new URL(String(url||'').trim());
    const host=u.hostname.replace(/^www\./,'');
    if(host==='youtu.be') return u.pathname.split('/').filter(Boolean)[0]||null;
    if(host.endsWith('youtube.com')){
      if(u.pathname==='/watch') return u.searchParams.get('v');
      const m=u.pathname.match(/^\/(?:embed|shorts|live)\/([^/?#]+)/);
      if(m) return m[1];
    }
  }catch(e){}
  return null;
}
function openYouTubeModal(url,title='YouTube'){
  const id=youtubeId(url);
  if(!id){toast('올바른 YouTube 링크가 아닙니다.');return}
  const modal=document.getElementById('ytModal');
  const frame=document.getElementById('ytFrame');
  const ttl=document.getElementById('ytModalTitle');
  if(!modal||!frame||!ttl){toast('영상 팝업을 열 수 없습니다.');return}
  ttl.textContent=title||'YouTube';
  frame.src=`https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&playsinline=1`;
  modal.classList.add('show');
  modal.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closeYouTubeModal(){
  const modal=document.getElementById('ytModal');
  const frame=document.getElementById('ytFrame');
  if(frame) frame.src='about:blank';
  if(modal){modal.classList.remove('show');modal.setAttribute('aria-hidden','true')}
  document.body.style.overflow='';
}

document.addEventListener('click',function(e){

    e.preventDefault();
    openYouTubeModal(play.dataset.ytUrl||'',play.dataset.ytTitle||'YouTube');

});

async function signedProfilePhoto(path,expires=3600){
  if(!path)return '';
  if(/^https?:\/\//i.test(path))return path;
  try{
    const {data,error}=await sb.storage.from('profile-photos').createSignedUrl(path,expires);
    return error?'':(data?.signedUrl||'');
  }catch(e){return ''}
}

async function saveGalleryAlbum(){
  const eventDate=document.getElementById('g_event_date')?.value;
  const titleV=document.getElementById('g_title')?.value.trim();
  const description=document.getElementById('g_description')?.value.trim()||null;const coverCaption=document.getElementById('galleryCoverCaption_0')?.value.trim()||null;
  if(!eventDate||!titleV)return toast('행사일자와 행사명은 필수입니다.');
  if(!galleryCoverFile)return toast('대표사진 1장을 선택해 주세요.');
  if(galleryPhotoFiles.length>20)return toast('추가사진은 최대 20장입니다.');
  const progress=document.getElementById('galleryUploadProgress');progress.style.display='block';progress.textContent='앨범을 생성하고 있습니다…';
  const {data:album,error}=await sb.from('gallery').insert({event_date:eventDate,title:titleV,description,created_by:me.id}).select().single();
  if(error){progress.style.display='none';return toast(error.message)}
  const albumId=album.id;
  try{
    const coverPath=`${albumId}/cover/${safeFileName(galleryCoverFile.name)}`;
    progress.textContent='대표사진 업로드 중…';
    let r=await sb.storage.from('gallery').upload(coverPath,galleryCoverFile,{upsert:false,contentType:galleryCoverFile.type||undefined});
    if(r.error)throw r.error;
    r=await sb.from('gallery').update({cover_path:coverPath,cover_caption:coverCaption}).eq('id',albumId);if(r.error)throw r.error;
    for(let i=0;i<galleryPhotoFiles.length;i++){
      const file=galleryPhotoFiles[i], path=`${albumId}/photos/${String(i+1).padStart(2,'0')}-${safeFileName(file.name)}`;
      progress.textContent=`추가사진 업로드 중… ${i+1} / ${galleryPhotoFiles.length}`;
      const up=await sb.storage.from('gallery').upload(path,file,{upsert:false,contentType:file.type||undefined});if(up.error)throw up.error;
      const caption=document.getElementById(`galleryPhotoCaption_${i}`)?.value.trim()||null;const ins=await sb.from('gallery_photos').insert({gallery_id:albumId,file_path:path,sort_order:i+1,caption});if(ins.error)throw ins.error;
    }
    progress.textContent='업로드 완료';
    toast('갤러리 앨범이 등록되었습니다.');galleryCoverFile=null;galleryPhotoFiles=[];manageGallery();
  }catch(err){
    progress.textContent='업로드 중 오류가 발생했습니다.';
    toast(err.message||String(err));
  }
}
async function deleteGalleryAlbum(id){
  if(!confirm('앨범과 등록된 사진을 모두 삭제하시겠습니까?'))return;
  const {data:photos}=await sb.from('gallery_photos').select('file_path').eq('gallery_id',id);
  const {data:album}=await sb.from('gallery').select('cover_path').eq('id',id).single();
  const paths=[album?.cover_path,...(photos||[]).map(x=>x.file_path)].filter(Boolean);
  if(paths.length)await sb.storage.from('gallery').remove(paths);
  const {error}=await sb.from('gallery').delete().eq('id',id);
  if(error)return toast(error.message);toast('삭제되었습니다.');manageGallery();
}

function songUrlField(k,l,v='',enabled=true){const part=k==='full_url'?'합창':k==='live_url'?'실제 찬양':k.replace('_url','');return `<div class="field"><label>${l} <span class="muted">(선택)</span></label><div class="ytSearchRow"><input style="flex:1;min-width:260px" id="f_${k}" type="url" value="${esc(v||'')}" placeholder="https://www.youtube.com/..." ${enabled?'':'disabled'}><button type="button" class="ytIconBtn" onclick="openYouTubeSearch('${esc(part)}')">▶ YouTube 검색</button><button type="button" class="btn" onclick="pasteClipboardTo('f_${k}')">붙여넣기</button></div></div>`}
function songPracticeFormHTML(obj={},isNew=false){const draft=isNew?getSongDraft():{};const val=k=>(draft[k]!==undefined?draft[k]:(obj[k]??''));const cats=isNew&&Array.isArray(draft.categories)?draft.categories:categoryArray(obj.category);let h='';if(canSongBase()){h+=`<div class="field"><label>연습 찬양일 <span class="muted">(연습 대상 주일)</span></label><input id="f_practice_date" type="date" value="${esc(val('practice_date')||val('service_date'))}"></div>`;h+=songCategoryHTML(cats);h+=`<div class="field"><label>찬양곡 <b>*필수</b></label><input id="f_title" value="${esc(val('title'))}" placeholder="곡명"></div>`;h+=songUrlField('full_url','합창 YouTube 링크',val('full_url'),true)}else{h+=`<div class="card" style="margin-bottom:12px"><b>${esc(obj.title||'찬양곡')}</b><div class="muted">${fmt(obj.practice_date||obj.service_date)} · ${esc(categoryDisplay(obj.category))}</div></div>`}for(const part of ['Soprano','Alto','Tenor','Bass']){const k=part.toLowerCase()+'_url';if(canSongPart(part))h+=songUrlField(k,part+' YouTube 링크',val(k),true)}h+=`<div class="codehint">연습영상은 보통 전주에 등록합니다. YouTube 검색창을 다녀와도 작성 내용은 임시저장됩니다.</div>`;return h}
function songReplayFormHTML(obj={},isNew=false){const draft=isNew?getSongDraft():{};const val=k=>(draft[k]!==undefined?draft[k]:(obj[k]??''));return `<div class="field"><label>다시보기 찬양일 <b>*필수</b></label><input id="f_replay_date" type="date" value="${esc(val('replay_date')||val('service_date'))}"></div><div class="field"><label>찬양곡 <b>*필수</b></label><input id="f_title" value="${esc(val('title'))}" placeholder="곡명"></div>${songUrlField('live_url','실제 찬양 YouTube 링크',val('live_url'),true)}<div class="codehint">실제 찬양 영상은 편집 후 월요일에 등록할 수 있습니다. 연습곡 날짜와 별도로 관리합니다.</div>`}
function bindSongDraft(){
  document.querySelectorAll('[id^="f_"],.songcat').forEach(e=>{
    e.addEventListener('input',saveSongDraft);e.addEventListener('change',saveSongDraft);
  });
}
async function restoreSongEdit(id){const {data,error}=await sb.from('songs').select('*').eq('id',id).single();if(error){clearSongEditorState();return go('more')}await editRecord('songs',data,true)}
function collectSong(){
  const o={};
  if(canSongBase()){
    const t=document.getElementById('f_title');o.title=t?t.value.trim():null;
    const sd=document.getElementById('f_service_date');o.service_date=sd?.value||null;
    o.category=[...document.querySelectorAll('.songcat:checked')].map(x=>x.value).join(',')||null;
    for(const k of ['full_url','live_url']){const e=document.getElementById('f_'+k);if(e)o[k]=e.value.trim()||null}
  }
  for(const part of ['Soprano','Alto','Tenor','Bass']){
    if(canSongPart(part)){const k=part.toLowerCase()+'_url';const e=document.getElementById('f_'+k);if(e)o[k]=e.value.trim()||null}
  }
  return o;
}

function collectTask(){const sel=document.getElementById('f_assignee_id'),opt=sel?.selectedOptions?.[0];return {due_date:document.getElementById('f_due_date')?.value||null,title:document.getElementById('f_title')?.value.trim()||null,assignee_id:sel?.value||null,assignee:opt?.dataset?.name||null,status:document.getElementById('f_status')?.value||'진행중',note:document.getElementById('f_note')?.value.trim()||null}}
function formHTML(type,obj={}){return (FIELDS[type]||[]).map(([k,l,kind='text',opts=''])=>{const v=obj[k]??'';if(kind==='textarea')return `<div class="field"><label>${l}</label><textarea id="f_${k}">${esc(v)}</textarea></div>`;if(kind==='select')return `<div class="field"><label>${l}</label><select id="f_${k}">${opts.split('|').map(o=>{const [value,label]=o.includes('=')?o.split('='):[o,o];const selected=value==(v||(k==='result_visibility'?'private':''))?'selected':'';return `<option value="${esc(value)}" ${selected}>${esc(label)}</option>`}).join('')}</select></div>`;if(kind==='checkbox')return `<div class="field"><label><input id="f_${k}" type="checkbox" ${v?'checked':''}> ${l}</label></div>`;return `<div class="field"><label>${l}</label><input id="f_${k}" type="${kind}" value="${esc(v)}"></div>`}).join('')}
function collect(type){const o={};for(const [k,,kind='text'] of FIELDS[type]||[]){const e=document.getElementById('f_'+k);o[k]=kind==='checkbox'?e.checked:kind==='number'?(e.value?Number(e.value):null):(e.value||null)}return o}

function pollFormHTML(obj={},options=[]){
 const parts=Array.isArray(obj.target_parts)?obj.target_parts:[];
 const target=obj.target_type||'all', response=obj.response_type||'single', visibility=obj.result_visibility||'private';
 const opts=(options&&options.length?options.map(x=>x.option_text||''):['','']);
 return `<div class="field"><label>설문 제목 <b>*필수</b></label><input id="poll_title" value="${esc(obj.title||'')}" placeholder="설문 제목"></div>
 <div class="field"><label>설문 기간 <b>*필수</b></label><div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center"><input id="poll_start_date" type="date" value="${esc(obj.start_date||'')}"><span>~</span><input id="poll_end_date" type="date" value="${esc(obj.end_date||'')}"></div></div>
 <div class="field"><label>설문 내용 설명</label><textarea id="poll_description" placeholder="설문의 목적이나 안내 내용을 입력하세요.">${esc(obj.description||'')}</textarea></div>
 <div class="field"><label>설문 항목 <b>*최소 2개</b></label><div id="pollOptionList">${opts.map((v,i)=>pollOptionRow(v,i)).join('')}</div><button type="button" class="btn" style="margin-top:8px" onclick="addPollOptionRow()">+ 설문 항목 추가</button></div>
 <div class="field"><label>설문 대상</label><div class="pollChoiceRow"><label><input class="pollChoiceBox" type="radio" name="poll_target" value="all" ${target==='all'?'checked':''} onchange="togglePollParts()"> 전체 대원</label><label><input class="pollChoiceBox" type="radio" name="poll_target" value="parts" ${target==='parts'?'checked':''} onchange="togglePollParts()"> 특정 파트</label></div><div id="pollParts" class="actions" style="margin-top:8px;${target==='parts'?'':'display:none'}">${['Soprano','Alto','Tenor','Bass'].map(x=>`<label class="btn"><input class="pollPart" type="checkbox" value="${x}" ${parts.includes(x)?'checked':''}> ${x}</label>`).join('')}</div></div>
 <div class="field"><label>설문 응답 선택</label><div class="pollChoiceRow"><label><input class="pollChoiceBox" type="radio" name="poll_response" value="single" ${response==='single'?'checked':''}> 단일 선택</label><label><input class="pollChoiceBox" type="radio" name="poll_response" value="multiple" ${response==='multiple'?'checked':''}> 복수 선택</label></div></div>
 <div class="field"><label>설문 결과 공개 시점</label><select id="poll_visibility"><option value="during" ${visibility==='during'?'selected':''}>설문 중 공개</option><option value="after_close" ${visibility==='after_close'?'selected':''}>설문 종료 후 공개</option><option value="private" ${visibility==='private'?'selected':''}>비공개</option></select></div>
 <div class="field"><label>상태</label><select id="poll_status"><option value="진행중" ${(obj.status||'진행중')==='진행중'?'selected':''}>진행중</option><option value="마감" ${obj.status==='마감'?'selected':''}>마감</option></select></div>`;
}
function pollOptionRow(value='',i=0){return `<div class="actions pollOptionRow" style="margin-top:8px;flex-wrap:nowrap"><input class="pollOptionInput" style="flex:1;min-width:0;border:1px solid #d6dae0;border-radius:11px;padding:12px" value="${esc(value)}" placeholder="설문 항목 ${i+1}"><button type="button" class="btn danger" onclick="removePollOptionRow(this)">삭제</button></div>`}
function renumberPollOptions(){document.querySelectorAll('.pollOptionInput').forEach((e,i)=>e.placeholder='설문 항목 '+(i+1))}
function addPollOptionRow(){document.getElementById('pollOptionList')?.insertAdjacentHTML('beforeend',pollOptionRow('',document.querySelectorAll('.pollOptionInput').length));renumberPollOptions()}
function removePollOptionRow(btn){if(document.querySelectorAll('.pollOptionInput').length<=2)return toast('설문 항목은 최소 2개가 필요합니다.');btn.closest('.pollOptionRow')?.remove();renumberPollOptions()}
function togglePollParts(){const v=document.querySelector('input[name="poll_target"]:checked')?.value;const box=document.getElementById('pollParts');if(box)box.style.display=v==='parts'?'flex':'none'}
function collectPollForm(){const target=document.querySelector('input[name="poll_target"]:checked')?.value||'all';return {poll:{title:document.getElementById('poll_title')?.value.trim()||'',start_date:document.getElementById('poll_start_date')?.value||null,end_date:document.getElementById('poll_end_date')?.value||null,description:document.getElementById('poll_description')?.value.trim()||null,target_type:target,target_parts:target==='parts'?[...document.querySelectorAll('.pollPart:checked')].map(x=>x.value):[],response_type:document.querySelector('input[name="poll_response"]:checked')?.value||'single',result_visibility:document.getElementById('poll_visibility')?.value||'private',status:document.getElementById('poll_status')?.value||'진행중'},options:[...document.querySelectorAll('.pollOptionInput')].map(x=>x.value.trim()).filter(Boolean)}}
function validatePollForm(v){if(!v.poll.title)return '설문 제목을 입력해 주세요.';if(!v.poll.start_date||!v.poll.end_date)return '설문 시작일과 종료일을 입력해 주세요.';if(v.poll.start_date>v.poll.end_date)return '설문 종료일은 시작일보다 빠를 수 없습니다.';if(v.options.length<2)return '설문 항목을 2개 이상 입력해 주세요.';if(v.poll.target_type==='parts'&&!v.poll.target_parts.length)return '설문 대상 파트를 하나 이상 선택해 주세요.';return ''}

async function savePollNew(){const v=collectPollForm(),msg=validatePollForm(v);if(msg)return toast(msg);v.poll.created_by=me.id;const {data,error}=await sb.from('polls').insert(v.poll).select('id').single();if(error)return toast(error.message);const rows=v.options.map((text,i)=>({poll_id:data.id,option_text:text,sort_order:i+1}));const {error:oe}=await sb.from('poll_options').insert(rows);if(oe){await sb.from('polls').delete().eq('id',data.id);return toast(oe.message)}toast('설문이 등록되었습니다.');manage('polls')}
async function savePollEdit(id){const v=collectPollForm(),msg=validatePollForm(v);if(msg)return toast(msg);const {error}=await sb.from('polls').update(v.poll).eq('id',id);if(error)return toast(error.message);const {error:de}=await sb.from('poll_options').delete().eq('poll_id',id);if(de)return toast(de.message);const rows=v.options.map((text,i)=>({poll_id:id,option_text:text,sort_order:i+1}));const {error:oe}=await sb.from('poll_options').insert(rows);if(oe)return toast(oe.message);toast('설문이 수정되었습니다.');manage('polls')}

async function addRecord(type,restored=false){setBackAction(()=>type==='gallery'?manageGallery():manage(type));if(type==='polls')return addPoll();if(type==='songs'){if(!canSongBase())return toast('새 찬양 등록은 총무/기본정보 담당자만 가능합니다.');setSongEditorState({mode:'new'});main.innerHTML=title('새 찬양 등록')+`<div class="card">${songFormHTML({},true)}<div class="actions"><button class="btn primary" onclick="saveNew('songs')">저장</button><button class="btn" onclick="cancelSongEdit()">취소</button></div></div>`;bindSongDraft();return}const html=type==='prayers'?await prayerFormHTML():type==='leaders'?await leaderFormHTML():type==='tasks'?await taskFormHTML():formHTML(type);main.innerHTML=title('새로 등록')+`<div class="card">${html}<div class="actions"><button class="btn primary" onclick="saveNew('${type}')">저장</button><button class="btn" onclick="manage('${type}')">취소</button></div></div>`}
async function editRecord(type,obj,restored=false){setBackAction(()=>type==='gallery'?manageGallery():manage(type));window._editObj=obj;if(type==='polls')return editPoll(obj);if(type==='songs'){setSongEditorState({mode:'edit',id:obj.id});main.innerHTML=title(canSongBase()?'찬양 수정':'내 파트 영상 입력')+`<div class="card">${songFormHTML(obj,false)}<div class="actions"><button class="btn primary" onclick="saveEdit('songs','${obj.id}')">저장</button><button class="btn" onclick="cancelSongEdit()">취소</button></div></div>`;bindSongDraft();return}const html=type==='prayers'?await prayerFormHTML(obj):type==='leaders'?await leaderFormHTML(obj):type==='tasks'?await taskFormHTML(obj):formHTML(type,obj);main.innerHTML=title('수정')+`<div class="card">${html}<div class="actions"><button class="btn primary" onclick="saveEdit('${type}','${obj.id}')">저장</button><button class="btn" onclick="manage('${type}')">취소</button></div></div>`}
function cancelSongEdit(){clearSongEditorState();manageSongs()}
async function saveNew(type){if(type==='songs'){const o=collectSong();if(!o.title)return toast('찬양곡명만 입력하면 저장할 수 있습니다.');o.created_by=me.id;const {error}=await sb.rpc('song_create_base',{p_service_date:o.service_date,p_category:o.category,p_title:o.title,p_full_url:o.full_url,p_live_url:o.live_url});if(error)return toast(error.message);clearSongEditorState();toast('찬양곡이 등록되었습니다. 파트별 영상은 각 파트장이 추가할 수 있습니다.');return manageSongs()}const map={notices:'notices',prayers:'prayer_assignments',events:'events',leaders:'leaders',gallery:'gallery',documents:'documents',polls:'polls',tasks:'tasks'};const o=type==='leaders'?collectLeader():type==='tasks'?collectTask():collect(type);if(['notices','prayers','events','leaders','gallery','documents','polls','tasks'].includes(type))o.created_by=me.id;const write=type==='leaders'?sb.from(map[type]).upsert(o,{onConflict:'role_name'}):sb.from(map[type]).insert(o);const {error}=await write;if(error)return toast(error.message);toast(type==='leaders'?'역할이 지정되었습니다.':'저장되었습니다.');manage(type)}
async function saveEdit(type,id){if(type==='songs'){const o=collectSong();if(canSongBase()){if(!o.title)return toast('찬양곡명은 필수입니다.');const {error}=await sb.rpc('song_update_base',{p_song_id:id,p_service_date:o.service_date,p_category:o.category,p_title:o.title,p_full_url:o.full_url,p_live_url:o.live_url});if(error)return toast(error.message)}for(const part of ['Soprano','Alto','Tenor','Bass']){if(canSongPart(part)){const k=part.toLowerCase()+'_url';if(k in o){const {error}=await sb.rpc('song_update_part',{p_song_id:id,p_part:part,p_url:o[k]});if(error)return toast(error.message)}}}clearSongEditorState();toast('수정되었습니다.');return manageSongs()}const map={notices:'notices',prayers:'prayer_assignments',events:'events',leaders:'leaders',gallery:'gallery',documents:'documents',polls:'polls',tasks:'tasks'};const payload=type==='leaders'?collectLeader():type==='tasks'?collectTask():collect(type);const {error}=await sb.from(map[type]).update(payload).eq('id',id);if(error)return toast(error.message);toast('수정되었습니다.');manage(type)}
async function deleteRecord(type,id){if(!confirm('삭제하시겠습니까?'))return;if(type==='songs'){const {error}=await sb.rpc('song_delete',{p_song_id:id});if(error)return toast(error.message);toast('삭제되었습니다.');return manageSongs()}const map={notices:'notices',prayers:'prayer_assignments',events:'events',leaders:'leaders',gallery:'gallery',documents:'documents',polls:'polls',tasks:'tasks'};const {error}=await sb.from(map[type]).delete().eq('id',id);if(error)return toast(error.message);toast('삭제되었습니다.');manage(type)}
let bulkMembersDraft=[];let bulkLastResults=[];
async function manageMembers(view='active',reason='전체'){
 setBackAction(()=>adminPage());
 const {data,error}=await sb.from('profiles').select('*').order('created_at',{ascending:false});
 if(error)return toast(error.message);
 const bulk=me.role==='superadmin'?`<div class="bulkBox"><h3 style="margin:0 0 8px">대원 일괄등록</h3><p class="muted">엑셀 명단을 CSV(UTF-8)로 저장해 업로드하면 로그인 계정과 대원 프로필을 한꺼번에 생성합니다. 필수 열: 이름, 직분, 파트, 휴대전화번호 · 초기비밀번호: Somang!+휴대전화 끝 4자리 · 첫 로그인 후 비밀번호 변경 필수</p><div class="bulkToolbar"><button class="btn" onclick="downloadMemberTemplate()">CSV 양식 다운로드</button><label class="btn primary" style="cursor:pointer">CSV 파일 선택<input id="bulkMemberFile" type="file" accept=".csv,text/csv" hidden onchange="previewBulkMembers(this.files[0])"></label><button id="bulkRunBtn" class="btn ok" style="display:none" onclick="runBulkMembers()">검토한 대원 일괄등록</button><button id="bulkResultBtn" class="btn" style="display:none" onclick="downloadBulkResults()">등록 결과 CSV</button></div><div id="bulkMemberPreview"></div></div>`:'';
 const members=(data||[]).filter(x=>view==='all'?(x.status==='approved'||x.status==='inactive'):view==='inactive'?x.status==='inactive':x.status==='approved').filter(x=>view!=='inactive'||reason==='전체'||x.inactive_reason===reason);
 const tabs=`<div class="adminMemberFilters"><div class="memberStatusTabs"><button class="btn ${view==='active'?'active':''}" onclick="manageMembers('active')">현재 대원</button><button class="btn ${view==='all'?'active':''}" onclick="manageMembers('all')">전체 대원</button><button class="btn ${view==='inactive'?'active':''}" onclick="manageMembers('inactive')">비활성 대원</button></div>${view==='inactive'?`<div class="inactiveReasonFilters">${['전체','은퇴','탈퇴','휴원','정지','기타'].map(r=>`<button class="btn ${reason===r?'active':''}" onclick="manageMembers('inactive','${r}')">${r}</button>`).join('')}</div>`:''}</div>`;
 const {data:historyRows,error:historyError}=await sb.from('member_status_history').select('member_id');
 if(historyError)return toast(historyError.message);
 const historyMemberIds=new Set((historyRows||[]).map(h=>h.member_id));
 const pending=(data||[]).filter(x=>x.status==='pending');
 const pendingHtml=pending.length?`<div class="card"><h3>가입 승인 대기 · ${pending.length}명</h3>${pending.map(x=>`<div class="row"><b>${esc(x.name)}</b> <span class="tag">${esc(partKo(x.part)||'-')}</span><div class="muted">${esc(phoneDisplay(x.phone))} · ${esc(x.title||'')}</div><div class="actions"><button class="btn ok" onclick="setStatus('${x.id}','approved')">승인</button><button class="btn danger" onclick="setStatus('${x.id}','rejected')">반려</button></div></div>`).join('')}</div>`:'';
 const exportTools=(me.role==='superadmin'||can('members'))?`<div class="memberAdminTools desktopMemberExport"><button class="btn" onclick="membersPage()">대원 현황</button><button class="btn primary" onclick="openMemberExport('excel')">Excel 다운로드</button><button class="btn" onclick="openMemberExport('pdf')">PDF 인쇄용</button><span class="memberExportHint">PC/Mac 관리자 전용</span></div>`:'';
 main.innerHTML=title('가입 승인 · 대원 관리')+exportTools+pendingHtml+bulk+tabs+list(members.map(x=>`<div class="row"><b>${esc(x.name)}</b> <span class="tag">${esc(partKo(x.part)||'-')}</span> ${x.status==='inactive'?`<span class="memberStatusBadge">${esc(x.inactive_reason||'비활성')}</span>`:''}<div class="muted">${esc(phoneDisplay(x.phone))} · ${esc(x.title||'')} · ${x.status==='approved'?'활성':'비활성'} · ${esc(roleKo(x.role))}</div>${x.status==='inactive'?`<div class="memberStatusMeta">${x.inactive_at?'비활성화 '+fmtStatusDate(x.inactive_at):''}${x.inactive_note?' · '+esc(x.inactive_note):''}</div>`:''}<div class="actions">${x.status==='approved'?`<button class="btn" onclick="openDeactivateMember('${x.id}')">비활성화</button>`:`<button class="btn ok" onclick="reactivateMember('${x.id}','${encodeURIComponent(x.name||'')}')">활성화</button>`}${historyMemberIds.has(x.id)?`<button class="btn" onclick="showMemberStatusHistory('${x.id}','${encodeURIComponent(x.name||'')}','${view}')">상태 이력</button>`:''}${me.role==='superadmin'?`<button class="btn" onclick="setRolePrompt('${x.id}','${x.role}')">역할</button>`:''}${(me.role==='superadmin'||can('members'))&&x.status==='approved'?`<button class="btn" onclick="resetMemberPassword('${x.id}','${esc(x.name)}','${esc(x.phone||'')}')">비밀번호 초기화</button>`:''}${me.role==='superadmin'&&x.id!==me.id&&x.role!=='superadmin'?`<button class="btn danger" onclick="deleteMember('${x.id}',decodeURIComponent('${encodeURIComponent(x.name||'')}'),decodeURIComponent('${encodeURIComponent(x.part||'')}'),decodeURIComponent('${encodeURIComponent(x.phone||'')}'))">완전 삭제</button>`:''}</div></div>`));
}

function memberExportAllowed(){return !!(me&&(me.role==='superadmin'||can('members')))}
function desktopExportAllowed(){return memberExportAllowed()&&window.matchMedia('(pointer:fine)').matches&&window.innerWidth>720}
function openMemberExport(format){
 if(!desktopExportAllowed())return toast('대원명부 파일 저장은 PC/Mac 관리자 화면에서만 가능합니다.');
 const old=document.getElementById('memberExportDialog');if(old)old.remove();
 const label=format==='excel'?'Excel (.xlsx)':'PDF';
 const d=document.createElement('div');d.id='memberExportDialog';d.className='memberExportDialog';
 d.innerHTML=`<div class="memberExportPanel"><h3>${label} 대원명부</h3><p class="muted">사진을 포함한 관리자용 대원정보를 저장합니다.</p><div class="field"><label>저장 대상</label><select id="memberExportScope"><option value="active">현재 대원</option><option value="all">전체 대원 (활성+비활성)</option><option value="inactive">비활성 대원</option></select></div><div class="actions"><button class="btn" onclick="closeMemberExport()">취소</button><button class="btn primary" onclick="runMemberExport('${format}')">${label} 만들기</button></div></div>`;
 d.addEventListener('click',e=>{if(e.target===d)closeMemberExport()});document.body.appendChild(d);
}
function closeMemberExport(){document.getElementById('memberExportDialog')?.remove()}
function dataUrlFromBlob(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
async function exportPhotoData(path){
 if(!path)return null;
 try{const url=await signedProfilePhoto(path);if(!url)return null;const res=await fetch(url);if(!res.ok)return null;return await dataUrlFromBlob(await res.blob())}catch(e){return null}
}
async function getMemberExportRows(scope){
 if(!memberExportAllowed())throw new Error('관리자 권한이 필요합니다.');
 const statuses=scope==='active'?['approved']:scope==='inactive'?['inactive']:['approved','inactive'];
 const {data,error}=await sb.from('profiles').select('*').in('status',statuses).order('part').order('name');if(error)throw error;
 let privateMap={};const {data:priv,error:privErr}=await sb.from('profile_private').select('user_id,birth_date,address');if(privErr)throw privErr;
 privateMap=Object.fromEntries((priv||[]).map(x=>[x.user_id,x]));
 const out=[];
 for(const x of (data||[]))out.push({...x,...(privateMap[x.id]||{}),photo_data:await exportPhotoData(x.photo_path)});
 return out;
}
function memberExportScopeLabel(scope){return scope==='active'?'현재 대원':scope==='inactive'?'비활성 대원':'전체 대원'}
function memberStatusKo(x){return x.status==='approved'?'활성':'비활성'}
function positionsText(x){return Array.isArray(x.choir_positions)?x.choir_positions.join(', '):(x.choir_positions||'')}
async function runMemberExport(format){
 if(!desktopExportAllowed())return toast('PC/Mac 관리자 화면에서만 가능합니다.');
 const scope=document.getElementById('memberExportScope')?.value||'active',dlg=document.getElementById('memberExportDialog');
 try{
  dlg?.classList.add('memberExportBusy');toast('대원명부를 만들고 있습니다.');
  const rows=await getMemberExportRows(scope);
  if(!rows.length)throw new Error('저장할 대원이 없습니다.');
  closeMemberExport();
  if(format==='excel')await downloadMembersExcel(rows,scope);else await downloadMembersPdf(rows,scope);
 }catch(e){dlg?.classList.remove('memberExportBusy');toast(e?.message||'파일 생성 중 오류가 발생했습니다.')}
}
async function downloadMembersExcel(rows,scope){
 if(!window.ExcelJS)throw new Error('Excel 모듈을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
 const wb=new ExcelJS.Workbook();wb.creator='SOMANG CHURCH CHOIR';wb.created=new Date();
 const ws=wb.addWorksheet(memberExportScopeLabel(scope));
 ws.columns=[
  {header:'사진',key:'photo',width:12},{header:'이름',key:'name',width:12},{header:'직분',key:'title',width:10},{header:'파트',key:'part',width:11},
  {header:'휴대전화',key:'phone',width:17},{header:'전자메일',key:'email',width:28},{header:'생년월일',key:'birth',width:14},{header:'주소',key:'address',width:34},
  {header:'찬양대 직위',key:'position',width:22},{header:'자기소개',key:'bio',width:32},{header:'상태',key:'status',width:10},
  {header:'비활성 사유',key:'reason',width:12},{header:'비활성화 일자',key:'inactiveAt',width:16},{header:'비고',key:'note',width:26},{header:'시스템 역할',key:'role',width:14}
 ];
 ws.getRow(1).font={bold:true};ws.getRow(1).height=24;ws.views=[{state:'frozen',ySplit:1}];ws.autoFilter={from:'A1',to:'O1'};
 let rno=2;
 for(const x of rows){
  const row=ws.addRow({name:x.name||'',title:x.title||'',part:partKo(x.part)||x.part||'',phone:phoneDisplay(x.phone)||'',email:x.contact_email||'',birth:x.birth_date||'',address:x.address||'',position:positionsText(x),bio:x.bio||'',status:memberStatusKo(x),reason:x.inactive_reason||'',inactiveAt:x.inactive_at?fmtStatusDate(x.inactive_at):'',note:x.inactive_note||'',role:roleKo(x.role)});
  row.height=48;row.alignment={vertical:'middle',wrapText:true};
  if(x.photo_data){
   try{const ext=String(x.photo_data).startsWith('data:image/png')?'png':'jpeg';const imageId=wb.addImage({base64:x.photo_data,extension:ext});ws.addImage(imageId,{tl:{col:0.15,row:rno-0.9},br:{col:0.85,row:rno-0.1},editAs:'oneCell'});}catch(e){}
  }
  rno++;
 }
 const buf=await wb.xlsx.writeBuffer(),blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`소망찬양대_${memberExportScopeLabel(scope)}_${localDateKey()}.xlsx`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
 toast('Excel 대원명부를 저장했습니다.');
}
function pdfEsc(v){return esc(String(v??''))}
async function downloadMembersPdf(rows,scope){
 if(!window.html2pdf)throw new Error('PDF 모듈을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
 document.getElementById('memberPdfStage')?.remove();
 const stage=document.createElement('div');stage.id='memberPdfStage';
 const body=rows.map(x=>`<tr style="break-inside:avoid;page-break-inside:avoid"><td>${x.photo_data?`<img class="pdfMemberPhoto" src="${x.photo_data}">`:`<div class="pdfNoPhoto">사진없음</div>`}</td><td><b>${pdfEsc(x.name)}</b><br>${pdfEsc(x.title||'')}</td><td>${pdfEsc(partKo(x.part)||x.part||'')}</td><td>${pdfEsc(phoneDisplay(x.phone)||'')}</td><td>${pdfEsc(x.birth_date||'')}</td><td>${pdfEsc(positionsText(x))}</td><td>${pdfEsc(x.contact_email||'')}</td><td>${pdfEsc(x.address||'')}</td><td>${pdfEsc(memberStatusKo(x))}${x.inactive_reason?'<br>'+pdfEsc(x.inactive_reason):''}</td></tr>`).join('');
 stage.innerHTML=`<div class="pdfMemberTitle">대한예수교장로회 창동교회 소망찬양대 · ${memberExportScopeLabel(scope)}</div><div class="pdfMemberMeta">작성일 ${localDateKey()} · ${rows.length}명</div><table class="pdfMemberTable"><thead><tr><th style="width:6%">사진</th><th style="width:10%">이름/직분</th><th style="width:7%">파트</th><th style="width:12%">휴대전화</th><th style="width:9%">생년월일</th><th style="width:12%">찬양대 직위</th><th style="width:15%">전자메일</th><th style="width:20%">주소</th><th style="width:9%">상태</th></tr></thead><tbody>${body}</tbody></table>`;
 document.body.appendChild(stage);
 await new Promise(r=>setTimeout(r,250));
 const opt={margin:[8,7,8,7],filename:`소망찬양대_${memberExportScopeLabel(scope)}_${localDateKey()}.pdf`,image:{type:'jpeg',quality:.96},html2canvas:{scale:1.7,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'landscape'},pagebreak:{mode:['css','legacy'],avoid:'tr'}};
 await html2pdf().set(opt).from(stage).save();stage.remove();toast('PDF 대원명부를 저장했습니다.');
}

async function openDeactivateMember(id){
 const {data,error}=await sb.from('profiles').select('id,name,title,part').eq('id',id).single();if(error)return toast(error.message);
 setBackAction(()=>manageMembers('active'));

function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}else cell+=c}row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}

 const ok=bulkMembersDraft.filter(x=>x.valid).length,bad=bulkMembersDraft.length-ok;document.getElementById('bulkMemberPreview').innerHTML=`<div class="muted" style="margin-top:10px">총 ${bulkMembersDraft.length}명 · <span class="bulkGood">정상 ${ok}</span> · <span class="bulkBad">확인 필요 ${bad}</span></div><div class="bulkPreview"><table><thead><tr><th>행</th><th>이름</th><th>직분</th><th>파트</th><th>휴대전화</th><th>검사</th></tr></thead><tbody>${bulkMembersDraft.map(x=>`<tr><td>${x.row}</td><td>${esc(x.name)}</td><td>${esc(x.title)}</td><td>${esc(x.part||'-')}</td><td>${esc(phoneDisplay(x.phone))}</td><td class="${x.valid?'bulkGood':'bulkBad'}">${x.valid?'정상':esc(x.error)}</td></tr>`).join('')}</tbody></table></div>`;const btn=document.getElementById('bulkRunBtn');btn.style.display=(ok&&bad===0)?'inline-flex':'none';

function loadDaumPostcode(){
  return new Promise((resolve,reject)=>{
    if(window.daum?.Postcode)return resolve();
    const old=document.getElementById('daum-postcode-sdk');
    if(old){old.addEventListener('load',()=>resolve(),{once:true});old.addEventListener('error',reject,{once:true});return;}
    const sc=document.createElement('script');
    sc.id='daum-postcode-sdk';
    sc.src='https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
    sc.onload=()=>resolve();sc.onerror=()=>reject(new Error('주소 검색 서비스를 불러오지 못했습니다.'));
    document.head.appendChild(sc);
  });
}
function isMobilePostcodeDevice(){

}

  const hidden=document.getElementById('pf_address');
  if(postcode)postcode.value=data.zonecode||'';
  if(road)road.value=data.roadAddress||data.jibunAddress||'';

async function openPostcodeSearch(){
  try{
    await loadDaumPostcode();
    if(isMobilePostcodeDevice()){
      const wrap=document.getElementById('postcodeEmbedWrap');
      const box=document.getElementById('postcodeEmbed');
      if(!wrap||!box)throw new Error('주소 검색 영역을 찾지 못했습니다.');
      wrap.hidden=false;
      box.innerHTML='';
      new daum.Postcode({
        oncomplete:applyPostcodeResult,
        onresize:function(size){
          box.style.height=Math.max(420,Math.min(size.height||500,560))+'px';
        },
        width:'100%',
        height:'100%'
      }).embed(box);
      wrap.scrollIntoView({behavior:'smooth',block:'center'});
    }else{
      new daum.Postcode({oncomplete:applyPostcodeResult}).open();
    }
  }catch(e){toast(e?.message||'주소 검색을 시작하지 못했습니다.');}
}

async function compressProfileImage(file,maxSize=700,quality=.82){
  const bitmap=await createImageBitmap(file);
  let w=bitmap.width,h=bitmap.height;
  const scale=Math.min(1,maxSize/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0,w,h);
  if(bitmap.close)bitmap.close();
  return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('사진 변환 실패')),'image/jpeg',quality));
}
async function uploadMyProfilePhoto(file){

  const path=`${me.id}/avatar.jpg`;
  const {error}=await sb.storage.from('profile-photos').upload(path,blob,{upsert:true,contentType:'image/jpeg',cacheControl:'3600'});

}

function renderPianoKeyboard(){
  const host=document.getElementById('pianoKeyboard');
  if(!host)return;
  const whiteNames=['C','D','E','F','G','A','B'];
  const solfege={C:'도',D:'레',E:'미',F:'파',G:'솔',A:'라',B:'시'};
  const blackAfter={C:'C♯',D:'D♯',F:'F♯',G:'G♯',A:'A♯'};
  let whites='',blacks='',whiteIndex=0;
  for(let octave=3;octave<=5;octave++){
    for(const name of whiteNames){
      const note=name+octave;
      whites+=`<button type=\"button\" class=\"pianoKey pianoWhiteKey ${name==='C'?'isC':''}\" data-note=\"${note}\" aria-label=\"${note} ${solfege[name]}\"><span class=\"pianoKeyLabel\">${note} · ${solfege[name]}</span></button>`;
      if(blackAfter[name]){
        const blackNote=blackAfter[name]+octave;
        const left=whiteIndex+1;
        blacks+=`<button type=\"button\" class=\"pianoKey pianoBlackKey\" data-note=\"${blackNote}\" aria-label=\"${blackNote}\" style=\"left:calc(${left} * var(--piano-white-key-width))\"></button>`;
      }
      whiteIndex++;
    }
  }
  host.innerHTML=`<div class=\"pianoWhiteKeys\">${whites}</div>${blacks}`;
  bindPianoKeys();
}

function ensurePianoAudio(){

}
function pianoNoteToMidi(note){const m=String(note).match(/^([A-G])([♯#]?)(\d)$/);if(!m)return null;const semis={C:0,D:2,E:4,F:5,G:7,A:9,B:11};return (Number(m[3])+1)*12+semis[m[1]]+(m[2]?1:0)}

function stopPianoNote(note,key){

function pianoNoteInfo(note){
  const m=String(note||'').match(/^([A-G])([♯#]?)(\d)$/);if(!m)return null;
  const sol={C:'도',D:'레',E:'미',F:'파',G:'솔',A:'라',B:'시'};
  const letterIndex={C:0,D:1,E:2,F:3,G:4,A:5,B:6};
  return {letter:m[1],sharp:!!m[2],octave:Number(m[3]),label:`${m[1]}${m[2]?'♯':''}${m[3]} · ${sol[m[1]]}${m[2]?'♯':''}`,diatonic:Number(m[3])*7+letterIndex[m[1]]};

function pianoStaffHTML(treble,note=pianoLastNote){
  const clef=treble?'𝄞':'𝄢',clefY=treble?72:68,info=pianoNoteInfo(note);
  let notation='';
  if(info){
    const base=treble?(4*7+2):(2*7+4); // treble bottom line E4, bass bottom line G2
    const y=78-(info.diatonic-base)*6;
    let ledgers='';
    if(y<30){for(let ly=18;ly>=y-1;ly-=12)ledgers+=`<line x1="278" y1="${ly}" x2="316" y2="${ly}"/>`;}
    if(y>78){for(let ly=90;ly<=y+1;ly+=12)ledgers+=`<line x1="278" y1="${ly}" x2="316" y2="${ly}"/>`;}
    notation=`<g stroke="currentColor" stroke-width="1.7">${ledgers}</g>${info.sharp?`<text x="265" y="${y+7}" font-size="25" font-family="serif" fill="currentColor">♯</text>`:''}<ellipse cx="297" cy="${y}" rx="9" ry="6.2" transform="rotate(-18 297 ${y})" fill="currentColor"/>`;
  }
  return `<svg viewBox="0 -72 420 216" role="img" aria-label="${treble?'높은음자리표':'낮은음자리표'} 오선${info?' '+info.label:''}" style="display:block;width:100%;height:auto;max-height:118px"><rect x="0" y="-72" width="420" height="216" rx="10" fill="transparent"/><g stroke="currentColor" stroke-width="1.5" opacity=".72"><line x1="72" y1="30" x2="398" y2="30"/><line x1="72" y1="42" x2="398" y2="42"/><line x1="72" y1="54" x2="398" y2="54"/><line x1="72" y1="66" x2="398" y2="66"/><line x1="72" y1="78" x2="398" y2="78"/></g><text x="18" y="${clefY}" font-size="58" font-family="serif" fill="currentColor">${clef}</text>${notation}</svg>`;
}
function renderPianoStaffNote(){

function selectPianoPart(part){
